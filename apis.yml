aid: qwiet-ai
name: Qwiet Ai
description: >-
  Qwiet AI (by Harness, formerly ShiftLeft) is an application security testing platform that
  unifies SAST, SCA, secrets, IaC, and container scanning with AI-assisted AutoFix remediation.
  The Qwiet AI API v4 (https://app.shiftleft.io/api/v4) lets teams programmatically manage
  applications, run and read code scans, work with findings and source-to-sink data flows,
  request and apply AutoFix recommendations, look up package CVEs (Intelligent SCA), manage
  RBAC/teams/tokens, and configure alerting webhooks and Slack notifications. Qwiet also ships
  a first-party CLI (`sl`), a published MCP server (harness-code-security-mcp), and packaged
  agent skills, making its code-security workflows agent-ready. Surfaced as a portfolio company
  of Mayfield and enriched from the provider's public developer surface.
