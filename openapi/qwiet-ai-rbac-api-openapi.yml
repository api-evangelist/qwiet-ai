        type: string
    rbacRoleID:
      name: rbacRoleID
      in: path
      description: The role ID
      required: true
      schema:
        type: string
        format: uuid
    rbacUserSort:
      name: sort
      in: query
      description: 'Field to sort results by. Defaults to `email` when omitted.

        '
      required: false
      schema:
        type: string
        enum:
        - name
        - email
        - role
        - joined
    rbacInvitationSearch:
      name: search
      in: query
      description: 'Case-insensitive substring search on the invitee''s name or email address.

        '
      required: false
      schema:
        type: string
        maxLength: 320
        minLength: 1
    rbacUserSearch:
      name: search
      in: query
      description: 'Case-insensitive substring search on the user''s display name or email address. Mutually exclusive with `email`.

        '
      required: false
      schema:
        type: string
        maxLength: 320
        minLength: 1
    humanGroupName:
