components:
  schemas:
    UpsertGroupIntoTeamRequest:
      allOf:
      - type: object
        required:
        - group_ids
        properties:
          group_ids:
            type: array
            items:
              $ref: '#/components/schemas/GroupAndRole'
    UpdateOrganizationUserRequest:
      allOf:
      - type: object
        required:
        - org_role
        properties:
          org_role:
            description: The role that should be assigned to the user.
            enum:
            - SUPER_ADMIN
            - POWER_USER
            - MEMBER
            - GUEST
            - TEAM_DEFINED
            type: string
    UpdateTeamMetadataRequest:
      allOf:
      - type: object
        required:
        - version
        properties:
          version:
            type: integer
            description: The team configuration version
          change_name:
            type: string
            description: The team's new name
    UpdateTeamMembershipRequest:
      allOf:
      - type: object
        required:
        - version
        properties:
          version:
            type: integer
            description: The team configuration version
          add_team_membership:
            type: array
            description: A list of the members to be added to the team
            items:
              type: object
              properties:
                user_id_v2:
                  type: string
                team_role:
                  type: string
          remove_team_membership:
            type: array
            description: A list of the members to be removed from the team
            items:
              type: object
              properties:
                user_id_v2:
                  type: string
                team_role:
                  type: string
    ListHumanGroupsResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ReadHumanGroupResponse'
    ListTeamsResponse:
      allOf:
      - type: array
        items:
          type: object
          properties:
            team_name:
              type: string
            team_id:
              type: string
            projects:
              type: array
              description: A list of the apps on this team
              items:
                type: string
            team_version:
              type: integer
              description: The version of the team
            risk_score:
              type: number
              description: The risk score of the team applications
            members:
              type: array
              description: The members of the team and their roles
              items:
                type: object
                properties:
                  user_id_v2:
                    type: string
                  team_role:
                    type: string
    CreateCustomRBACRoleRequest:
      allOf:
      - type: object
        required:
        - name
        - scopes
        properties:
          name:
            type: string
            description: The name of the role
          description:
            type: string
            description: The description of the role
          scopes:
            type: array
            description: The array of scopes that are granted by the role
            items:
              $ref: '#/components/schemas/Scope'
          role_type:
            $ref: '#/components/schemas/RoleType'
    UpdateTeamAppsRequest:
      allOf:
      - type: object
        required:
        - version
        properties:
          version:
            type: integer
            description: The team configuration version
          add_applications:
            type: array
            description: A list of the applications to add to the team
            items:
              type: string
          force_app_inclusion:
            type: boolean
            description: Whether the app should be added if it belongs to another team. The app will be removed from the conflicting team if added
          remove_applications:
            type: array
            description: A list of the application IDs to remove from the team
            items:
              type: string
    UpdateRBACRoleRequest:
      allOf:
      - type: object
        required:
        - scopes
        properties:
          name:
            type: string
            description: The name of the role
          description:
            type: string
            description: The description of the role
          scopes:
            type: array
            description: The array of scopes that are granted by the role
            items:
              $ref: '#/components/schemas/Scope'
    NextPage:
      type: string
      description: URL for the next page of results
      example: https://api.shiftleft.io/orgs/4c07962d-745f-4465-9965-002f6cf3c7ff/findings?page=2
    Scope:
      type: string
      pattern: ^\w+:\w+$|^\w+:\*$
    RBACRole:
      allOf:
      - type: object
        required:
        - id
        - scopes
        properties:
          id:
            type: string
            format: uuid
            description: The role ID
          id_aliases:
            type: array
            description: A list of human-readable aliases that can be used instead of the ID in requests
            items:
              type: string
          description:
            type: string
            description: A summary of the scopes that are granted by the role
          scopes:
            type: array
            description: The array of scopes that are granted by the role
            items:
              $ref: '#/components/schemas/Scope'
          resource_type:
            $ref: '#/components/schemas/ResourceType'
          role_type:
            $ref: '#/components/schemas/RoleType'
    CreateTeamRequest:
      allOf:
      - type: object
        required:
        - name
        properties:
          name:
            type: string
            description: The name of the team to be created
          applications:
            type: array
            description: The applications that should be added to the team
            items:
              type: string
          members:
            type: array
            description: The members that should be added to the team
            items:
              type: object
              properties:
                user_id_v2:
                  type: string
                team_role:
                  type: string
    ReadHumanGroupResponse:
      allOf:
      - type: object
        properties:
          group_id:
            type: string
            description: The ID of the group
          group_name:
            type: string
            description: The name of the group
          members:
            type: array
            description: The members of the group and their roles
            items:
              type: object
              properties:
                user_id:
                  type: string
                email:
                  type: string
          teams:
            type: array
            description: The teams that are part of the group
            items:
              type: object
              properties:
                team_id:
                  type: string
                team_name:
                  type: string
                role:
                  type: string
    Error:
      type: object
      required:
      - ok
      - code
      - message
      properties:
        ok:
          type: boolean
          description: Whether the request was successful (true) or not (false)
        code:
          type: string
          description: The `enum` representing the error encountered
          example: INTERNAL_SERVER_ERROR
        message:
          type: string
          description: A message describing the error
          example: Internal Server Error
        validation_errors:
          type: array
          description: The validation errors the user should correct before re-submitting the request
          items:
            type: string
            description: A description of the validation error
    ListRBACUserInfo:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        id_v2:
          type: string
          format: uuid
        group_membership:
          type: array
          items:
            $ref: '#/components/schemas/ReadHumanGroupResponse'
        team_membership:
          type: array
          items:
            type: object
            properties:
              team_name:
                type: string
                description: The team to which the user belongs
              team_id:
                type: string
                description: The ID of the team to which the user belongs
              resource_type:
                type: string
                description: The type of resource to which the user belongs
              role:
                type: string
                format: uuid
                description: The team-based role ID assigned to the user
              role_aliases:
                type: array
                description: The role aliases that can also be used to refer to the role ID
                items:
                  type: string
              role_name:
                type: string
                description: The team-based name of the role assigned to the user
        last_login_utc_timestamp_history:
          type: array
          description: List of nanosecond unix timestamps for last two user logins
          items:
            type: integer
        last_activity_utc_timestamp:
          type: integer
          description: Nanosecond unix timestamp for last user activity
        joined_utc_timestamp:
          type: integer
          description: Nanosecond unix timestamp for when the user joined the organization
    RoleType:
      type: string
      enum:
      - team
      - organization
      - qwiet
      example: team
      description: The type of role. This is used to categorize roles and determine in what context they can be used. Team roles can only be used in teams, organization roles can be used across the organization, and qwiet roles are predefined roles. Note that 'qwiet' type is reserved for system-defined roles and cannot be used when creating or updating custom roles.
    CreateTeamResponse:
      allOf:
      - type: object
        required:
        - team_id
        properties:
          team_id:
            type: string
    ListRBACInvitationInfo:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          format: uuid
          description: 'The org-level role ID the invitee will receive on acceptance. Empty when no org-level role is recorded for the invitation.

            '
        invited_utc_timestamp:
          type: integer
          description: Nanosecond unix timestamp for when the invitation was created
    ResourceType:
      type: string
      enum:
      - organization
      - application
      - organization_user
      - team
      description: The type of resource to which the role applies
    GroupAndRole:
      allOf:
      - type: object
        properties:
          group_id:
            type: string
          team_role:
            type: string
    UpdateGroupRoleRequest:
      allOf:
      - type: object
        properties:
          team_role:
            type: string
    UpdateTeamRequest:
      allOf:
      - type: object
        properties:
          version:
            type: integer
            description: The team configuration version
          add_applications:
            type: array
            description: A list of the application to add to this team
            items:
              type: string
          force_app_inclusion:
            type: boolean
            description: Whether the app should be added if it belongs to another team (the app will be removed from the conflicting team if added)
          remove_applications:
            type: array
            description: A list of the applications to remove from the team
            items:
              type: string
          add_team_membership:
            type: array
            description: A list of members to be added to the team
            items:
              type: object
              properties:
                user_id_v2:
                  type: string
                team_role:
                  type: string
          remove_team_membership:
            type: array
            description: A list of members to be removed from the team
            items:
              type: object
              properties:
                user_id_v2:
                  type: string
                team_role:
                  type: string
    DeleteTeamRequest:
      allOf:
      - type: object
        required:
        - version
        properties:
          version:
            type: integer
            description: The team's configuration version
    ReadTeamResponse:
      allOf:
      - type: object
        properties:
          team_id:
            type: string
            description: The ID of the team
          risk_score:
            type: number
            description: The risk score of the team applications
          version:
            type: integer
            description: The version of the team
          applications:
            type: array
            description: The applications that are part of the team
            items:
              type: string
          groups:
            type: array
            description: The groups that are members of the team
            items:
              $ref: '#/components/schemas/ReadHumanGroupResponse'
          members:
            type: array
            description: The members of the team and their roles
            items:
              type: object
              properties:
                user_id_v2:
                  type: string
                team_role:
                  type: string
    SuccessResponse:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
          description: Whether the request was successful or not
  parameters:
    humanGroupSearch:
