  /orgs/{orgID}/compounds/named/{compoundName}/scans/streamlined:
    get:
      tags:
        - compounds
        - scans
      summary: >-
        List scans in a compound, returning a subset of the scan summary
        information
      operationId: GetStreamlinedScans
      description: >-
        The full information we can return about a scan is a lot of data, which
        slows down a UI that only wants to present a subset of it to the user.
        This endpoint returns only the subset actually needed for rendering that
        UI. As such it's meant for internal use only, but is documented because
        other API users may find it useful for similar reasons.
      parameters:
        - $ref: '#/components/parameters/orgID'
        - $ref: '#/components/parameters/compoundName'
        - in: query
          name: limit
          description: The number of scans to return.
          schema:
            type: integer
            minimum: 1
            default: 10
            maximum: 100
        - in: query
          name: branch
          description: Only consider scans on this branch.
          schema:
            type: string
        - in: query
          name: upto
          description: >-
            Only list scans created before this time (given in nanoseconds since
            the UNIX Epoch).
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - response
                    properties:
                      next_page:
                        $ref: '#/components/schemas/NextPage'
                      response:
                        type: object
                        required:
                          - scans
                          - agents
                        properties:
                          agents:
                            type: array
                            items:
                              type: string
                              example: vscode
                          scans:
                            type: array
                            items:
                              $ref: '#/components/schemas/StreamlinedScan'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
