  /orgs/{orgID}/tokens:
    parameters:
      - $ref: '#/components/parameters/orgID'
    get:
      tags:
        - tokens
      summary: List tokens
      operationId: ListTokens
      description: >
        Return a list of tokens issued by the org.


        The token data returned includes metadata that identifies a token,
        included permissions, and an ID you can use to delete/revoke the token.
        The token data does NOT return the token value, which is exposed only
        when Qwiet issues the token.
      security:
        - BearerToken:
            - tokens:list
      parameters:
        - name: show_expired
          in: query
          description: Whether expired tokens should be returned or not
          schema:
            type: boolean
        - name: token_type
          in: query
          description: Filter the response by the type of token
          schema:
            $ref: '#/components/schemas/TokenType'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - response
                    properties:
                      response:
                        type: array
                        items:
                          $ref: '#/components/schemas/Token'
              example:
                ok: true
                response:
                  - id: b7f521ca-d3f8-4a22-b7d9-8d12b1a7c1b7
                    label: Jira integration token
                    description: >-
                      This token was generated to integrate the Qwiet Jira
                      Plugin
                    role_id: 5b588f3a-7fe0-444d-afbb-c0d5ee04139b
                    token_type: integration
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - tokens
      summary: Create token
      operationId: CreateToken
      description: >-
        Create a new token for use with the API. The token can be assigned a
        role using the `role_id` parameter in the request body.
      security:
        - BearerToken:
            - tokens:create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewToken'
            example:
              label: On-prem Jira
              description: Used by the on-prem Jira integration to communicate with Qwiet
              role_id: 5b588f3a-7fe0-444d-afbb-c0d5ee04139b
              token_type: integration
              valid_for_seconds: 600
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - response
                    properties:
                      response:
                        $ref: '#/components/schemas/CreateOrgTokenResponse'
              example:
                ok: true
