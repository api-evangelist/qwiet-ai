  /orgs/{orgID}/scm-secrets-audit-log:
    parameters:
      - $ref: '#/components/parameters/orgID'
    get:
      tags:
        - orgs
      summary: Returns the audit log report for the org's SCM secrets
      operationId: GetOrgSCMSecretsAuditLog
      description: >
        Returns the audit log report for the org's SCM secrets, showing the
        number of times secrets were attempted to be committed to a repository.
        The report can be grouped by project or user. One of the 'by-project' or
        'by-user' query parameters must be specified.
      security:
        - BearerToken:
            - org_runs:read
      parameters:
        - name: days
          in: query
          description: >-
            Specifies the number of days for which the audit log should be
            calculated; defaults to 31.
          schema:
            type: integer
            default: 31
        - name: by-project
          in: query
          required: false
          description: If present, the report will be grouped by project.
          schema:
            type: boolean
        - name: by-user
          in: query
          required: false
          description: If present, the report will be grouped by user.
          schema:
            type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - response
                    properties:
                      response:
                        type: object
                        required:
                          - total_attempts
                          - projects
                        properties:
                          total_attempts:
                            type: integer
                            description: >-
                              The number of times one or more secrets were
                              attempted to be committed to a repository
                            example: 3
                          total_user_ids:
                            type: array
                            description: >-
                              The user IDs of the users who attempted to commit
                              secrets
                            items:
                              type: string
                              example: 261f1203-748d-4010-a57d-4cf3107f8647
                          total_token_ids:
                            type: array
                            description: The token IDs which attempted to commit secrets
                            items:
                              type: string
                              example: 261f1203-748d-4010-a57d-4cf3107f8647
                          projects:
                            type: array
                            description: >-
                              For each project with a non-zero amount of
                              attempts, the project's name and the number of
                              attempts
                            items:
                              type: object
                              description: Project and number of attempts for it
                              properties:
                                project_id:
                                  type: string
                                  description: The project ID
                                  example: hsl
                                attempts:
                                  type: integer
                                  description: >-
                                    The number of times one or more secrets were
                                    attempted to be committed to a repository
                                    for this project
                                  example: 3
                                user_ids:
                                  type: array
                                  description: >-
                                    The user IDs of the users who attempted to
                                    commit secrets
                                  items:
                                    type: string
                                    example: 261f1203-748d-4010-a57d-4cf3107f8647
                                token_ids:
                                  type: array
                                  description: >-
                                    The token IDs which attempted to commit
                                    secrets
                                  items:
                                    type: string
                                    example: 261f1203-748d-4010-a57d-4cf3107f8647
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
