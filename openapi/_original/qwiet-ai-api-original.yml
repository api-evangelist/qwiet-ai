          description: >-
            The authentication type to use for the webhook. Defaults to "hmac"
            if secret is provided, "bearer" if token is provided.
        secret:
          type: string
          description: >-
            Secret key for HMAC authentication. If not provided and authType is
            "hmac", a secure secret will be generated automatically.
        enableEmailNotification:
          type: boolean
          description: >-
