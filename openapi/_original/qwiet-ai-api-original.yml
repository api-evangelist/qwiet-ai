  /orgs/{orgID}/compounds/byname/{compoundName}/findings:
    parameters:
      - $ref: '#/components/parameters/orgID'
      - $ref: '#/components/parameters/compoundName'
      - in: query
        name: polyglot_scan
        description: Polyglot scan ID to filter to; defaults to the latest scan.
        schema:
          type: string
      - in: query
        name: scan_version
        description: >-
          The version of the code at scan time. Ignored if polyglot_scan is
          given.
        schema:
          type: string
      - in: query
        name: scan_branch
        description: >-
          The code branch at scan time. Ignored if polygot_scan or scan_version
          are given.
        schema:
          type: string
      - in: query
        name: scan_tag
        description: >-
          Tags passed to the analyzer at scan time. Ignored if polygot_scan,
          scan_version, or scan_branch are given.
        schema:
          type: string
          pattern: ^(?<key>.*?)__eq__(?<value>.*)$
      - in: query
        name: scan_platform
        description: >-
          The analysis platform. Cannot be specified together with
          scan_language.
        schema:
          $ref: '#/components/schemas/ScanPlatform'
      - in: query
        name: scan_language
        description: >-
          The analysis language. Cannot be specified together with
          scan_platform.
        schema:
          $ref: '#/components/schemas/ScanLanguage'
      - in: query
        name: counts_exclude
        description: >
          The tags to exclude from 'counts' in the response. Can be specified
          more than once. The default filters out a small set of tags that don't
          add too much value in the kind of aggregate that 'counts' contains. An
          empty value resets the list.
        schema:
          type: string
      - in: query
        name: finding_type
        description: Only list findings of the given type. Can be specified multiple times.
        schema:
          type: string
          enum:
            - vuln
            - secret
            - insight
            - extscan
            - oss_vuln
            - container
            - security_issue
      - in: query
        name: finding_status
        description: >-
          Only list findings with the given status. Can be specified multiple
          times.
        schema:
          type: string
          enum:
            - ignored
            - fixed
            - 3rdparty
      - in: query
        name: finding_assignee
        description: >-
          Only list findings with the given assignee. Cannot be specified
          together with finding_assignment.
        schema:
          type: string
          format: email
      - in: query
        name: finding_assignment
        description: Only list findings of the given assignment state.
        schema:
          type: string
          enum:
            - assigned
            - unassigned
      - in: query
        name: finding_tag
        description: >
          Only list findings matching the given tag query. Can be specified up
          to 20 times. A finding will match a series of tag queries if it
          matches all of them.
        schema:
          type: string
          pattern: ^(?<key>.*?)__(?<operator>.*?)__(?<value>.*)$
        examples:
          equality:
            value: category__equal__SQL Injection
            summary: >
              Matches findings with a tag of the given key and a value that is
              equal to that given.

              Operator aliases: eq.
          inequality:
            value: category__not_equal__SQL Injection
            summary: >
              Matches findings with a tag of the given key and a value that is
              _not_ equal to that given.

              Operator aliases: ne, neq.
          case-insensitive equality:
            value: category__equal_fold__sql injection
            summary: >
              Matches findings with a tag of the given key and a value that is
              equal under simple Unicode case-folding to that given.

              Operator aliases: ieq.
          case-insensitive inequality:
            value: category__not_equal_fold__sql injection
            summary: >
              Matches findings with a tag of the given key and a value that is
              _not_ equal under simple Unicode case-folding to that given.

              Operator aliases: nieq, ineq, ine.
          containment:
            value: category__contains__SQL
            summary: >
              Matches findings with a tag of the given key and a value that
              contains the given value.

              Operator aliases: has.
          non-containment:
            value: category__not_contains__SQL
            summary: >
              Matches findings with a tag of the given key and a value that does
              _not_ contain the given value.

              Operator aliases: nhas.
          case-insensitive containment:
            value: category__contains_fold__SQL
            summary: >
              Matches findings with a tag of the given key and a value that
              contains the given value under simple Unicode case-folding.

              Operator aliases: ihas.
          case-insensitive non-containment:
            value: category__not_contains_fold__SQL
            summary: >
              Matches findings with a tag of the given key and a value that does
              _not_ contain the given value under simple Unicode case-folding.

              Operator aliases: nihas, inhas.
          inclusion:
            value: category__in__foo,bar
            summary: >
              Matches findings with a tag of the given key and a value equal to
              one of the elements in the given comma-separated list.
          exclusion:
            value: category__not_in__foo,bar
            summary: >
              Matches findings with a tag of the given key and a value that is
              _not_ equal to one of the elements in the given comma-separated
              list.

              Operator aliases: nin.
          case-insensitive inclusion:
            value: category__in_fold__foo,bar
            summary: >
              Matches findings with a tag of the given key and a value equal
              under simple Unicode case-folding to one of the elements in the
              given comma-separated list.

              Operator aliases: iin.
          case-insensitive exclusion:
            value: category__not_in_fold__foo,bar
            summary: >
              Matches findings with a tag of the given key and a value that is
              _not_ equal under simple Unicode case-folding to one of the
              elements in the given comma-separated list.

              Operator aliases: niin.
          approximate floating-point value:
            value: cvss_score__approx__2
            summary: >
              Matches findings with a tag of the given key and a value that when
              interpreted as a floating point is less than 0.09 away from that
              given.
          less than floating-point value:
            value: cvss_score__lt__2
            summary: >
              Matches findings with a tag of the given key and a value that when
              interpreted as a floating point is less than that given.
          less than or equal to floating-point value:
            value: cvss_score__lte__2
            summary: >
              Matches findings with a tag of the given key and a value that when
              interpreted as a floating point is less than or equal to that
              given.
          greater than floating-point value:
            value: cvss_score__gt__2
            summary: >
              Matches findings with a tag of the given key and a value that when
              interpreted as a floating point is greater than that given.
          greater than or equal to floating-point value:
            value: cvss_score__gte__2
            summary: >
              Matches findings with a tag of the given key and a value that when
              interpreted as a floating point is greater than or equal to that
              given.
      - in: query
        name: finding_search
        description: >
          Only list findings containing the given value (under simple Unicode
          case-folding) in their title or description. Can be specified up to 5
          times.  A finding will match a series of searches if it matches all of
          them.
        schema:
          type: string
      - in: query
        name: finding_reachable
        description: |
          Only list reachable findings.
        schema:
          type: boolean
      - in: query
        name: finding_exploitable
        description: |
          Only list exploitable findings.
        schema:
          type: boolean
      - in: query
        name: finding_has_ai_fix
        description: |
          Only list findings with an AI fix available.
        schema:
          type: boolean
      - in: query
        name: finding_sort
        description: >
          The field used to sort results.

          If not given, the default is to sort by ID in descending order. When
          given, sort by that criterion, defaulting to ascending order.
        schema:
          type: string
          enum:
            - id
            - title
            - severity
            - created_at
      - in: query
        name: finding_order
        description: |
          How results are sorted. See the note on finding_sort for defaults.
        schema:
          type: string
          enum:
            - desc
            - asc
      - in: query
        name: page
        description: >
          The page of results to fetch. Only the findings portion of the
          response is paginated; counts and scans are present every time.
        schema:
          type: integer
          minimum: 1
      - in: query
        name: per_page
        description: Number of results per page; defaults to 50
        schema:
          type: integer
          minimum: 1
          maximum: 250
      - in: query
        name: finding_fields
        description: >
          Specifies the fields included or excluded in the findings in the
          response. Can be specified more than once.
        schema:
          type: string
          enum:
            - '-description'
    get:
      tags:
        - findings
      summary: List compound findings
      operationId: ListCompoundFindings
      description: >
        List findings for the specified compound. Results are for a single
        polyglot scan (by default, this is the latest scan).
      security:
        - BearerToken:
            - findings:list
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - response
                    properties:
                      next_page:
                        $ref: '#/components/schemas/NextPage'
                      response:
                        type: object
                        properties:
                          has_more:
                            type: boolean
                            example: true
                            description: >-
                              Whether asking for the next page would return
                              additional findings.
                          polyglot_scan:
                            type: object
                            properties:
                              compound_id:
                                type: string
                                format: uuid
                                description: >
                                  The compound ID of the polyglot scan. Will be
                                  omitted iff the scan is not part of a
                                  compound.
                              polyglot_scan_id:
                                type: integer
                                minimum: 1
                                description: >
                                  The polyglot scan ID. Will be omitted iff the
                                  scan is not part of the compound.
                              scans:
                                type: array
                                description: >
                                  The element scans that form the polyglot scan.
                                  Can be empty if all elements were filtered by
                                  language or platform filtering.
                                items:
                                  $ref: '#/components/schemas/Scan'
                          findings:
                            type: array
                            description: >
                              The findings relevant to the query. This entry
                              will empty if there are no matching findings.
                            items:
                              $ref: '#/components/schemas/Finding'
                          total_count:
                            type: integer
                            minimum: 0
                            description: >
                              The total number of findings matching the query,
                              before pagination.
                          counts:
                            type: array
                            description: >
                              Summaries of the tags of the findings relevant to
                              the query. This entry be omitted if there are no
                              matching findings.

                              NOTE that some tags are multi-valued and so the
                              count can be greater than the number of findings.
                            items:
                              type: object
                              properties:
                                key:
                                  type: string
                                value_counts:
                                  type: object
                                  additionalProperties:
                                    type: integer
                              example:
                                key: cvss_31_severity_ratings
                                value_counts:
                                  critical: 1
                                  high: 2
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
