    CompoundFixStats:
      type: object
      properties:
        compound_name:
          type: string
          description: name of compound
        fix_count:
          type: integer
          description: number of fixes available
    WizStoreCredsRequest:
      type: object
      properties:
        client_id:
          type: string
          description: service account client id
        client_secret:
          type: string
          description: service account client secret
        auth_url:
          type: string
          description: wiz authentication url (i.e. "https://auth.app.wiz.io/oauth/token")
        api_url:
          type: string
          description: wiz api endpoint (i.e. "https://api.us17.app.wiz.io/graphql")
    WizProjectEnrollmentRequest:
      type: object
      properties:
        enrolled_for:
          type: array
          description: enrichment type, possible values [SAST, SCA]
          items:
            type: string
        scope:
          type: string
          description: >-
            indicates the scope from which configuration are fetched. If no
            config found for requested scope, it fetches the config from higher
            level. possible values- compound / organization.
        is_enabled:
          type: boolean
          description: >-
            disables enrichment at the config level. i.e. If a compound level
            enrichment is disabled, the compound will be ignored during
            enrichment even if the org level enrichment is enabled. Granular
            level configuration takes the higher precedence.
    PackageInfo:
