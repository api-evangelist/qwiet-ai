    get:
      tags:
        - sarif
      summary: Download Compound SARIF Report
      operationId: DownloadSarifReport
      description: Downloads the SARIF report for the specified compound.
      parameters:
        - $ref: '#/components/parameters/orgID'
        - $ref: '#/components/parameters/compoundName'
        - in: query
          name: polyglot_scan
          description: Polyglot scan ID to filter to; defaults to the latest scan.
          schema:
            type: string
        - in: query
          name: scan_version
          description: >-
            The version of the code at scan time. Ignored if polyglot_scan is
            given.
          schema:
            type: string
        - in: query
          name: scan_branch
          description: >-
            The code branch at scan time. Ignored if polygot_scan or
            scan_version are given.
          schema:
            type: string
        - in: query
          name: scan_tag
          description: >-
            Tags passed to the analyzer at scan time. Ignored if polygot_scan,
            scan_version, or scan_branch are given.
          schema:
            type: string
            pattern: ^(?<key>.*?)__eq__(?<value>.*)$
        - in: query
          name: scan_platform
          description: >-
            The analysis platform. Cannot be specified together with
            scan_language.
          schema:
            $ref: '#/components/schemas/ScanPlatform'
        - in: query
          name: scan_language
          description: >-
            The analysis language. Cannot be specified together with
            scan_platform.
          schema:
            $ref: '#/components/schemas/ScanLanguage'
      security:
        - BearerToken:
            - findings:list
      responses:
        '200':
          description: SARIF report file streamed as download
          content:
            application/sarif+json:
              schema:
