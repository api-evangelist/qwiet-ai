      - $ref: '#/components/parameters/version'
    put:
      tags:
        - alerting
      summary: Set up a webhook
      operationId: SetUpWebhook
      description: |
        Set up a webhook for the given organization
      security:
        - BearerToken:
            - webhook:write
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterWebhookRequest'
            examples:
              bearerAuth:
                summary: Bearer Token Authentication Example
                description: >-
                  Example request body for webhook registration using Bearer
                  token authentication
                value:
                  url: https://example.com/webhook
                  events:
                    - name: scan.finished
                  token:
                    token: your-bearer-token
                    renewalMetadata:
                      url: https://example.com/renew-token
                      method: POST
                      bodyFields:
                        client_id: your-client-id
                        client_secret: your-client-secret
                        grant_type: client_credentials
                      asJson: false
                      forceFormUrlEncoding: false
                    responseHandling:
                      tokenField: access_token
                      ttlField: expires_in
                      typeField: token_type
                  authType: bearer
                  enableEmailNotification: true
              hmacAuth:
                summary: HMAC Authentication Example
                description: >-
                  Example request body for webhook registration using HMAC
                  secret authentication. This is the primary method used for
                  UI-based webhook configuration.
                value:
                  url: https://simulate-400.free.beeceptor.com/webhook
                  events:
                    - name: scan.finished
                  secret: my-test-secret
                  authType: hmac
                  enableEmailNotification: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterWebhookResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - alerting
      summary: Delete a webhook
      operationId: DeleteWebhook
      description: |
