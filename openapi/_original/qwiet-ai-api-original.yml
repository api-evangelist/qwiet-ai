  /orgs/{orgID}/apps/{compoundName}/scans/check:
    parameters:
      - $ref: '#/components/parameters/orgID'
      - $ref: '#/components/parameters/compoundName'
    post:
      tags:
        - scans
      summary: Check a scan against a set of rules
      description: Check a scan against a set of rules, using another scan as a reference.
      operationId: CheckScans
      security:
        - BearerToken:
            - findings:list
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - version
                - meta
                - rules
              properties:
                version:
                  type: integer
                  enum:
                    - 2
                meta:
                  type: object
                  required:
                    - kind
                  properties:
                    num_findings:
                      type: integer
                      description: >
                        The maximum number of findings per rule to be returned.
                        Can be overridden on a per-rule basis using the rule's
                        `num_findings` property.
                      minimum: 0
                      default: 5
                      maximum: 100
                    kind:
                      type: string
                      enum:
                        - single
                        - diff
                      default: diff
                    send-to-jira:
                      type: boolean
                      description: >
                        Requests that findings be sent to Jira; the organization
                        must have the Jira integration enabled and configured
                        for this feature to work.
                source:
                  allOf:
                    - $ref: '#/components/schemas/AppScanCheckScan'
                    - type: object
                      description: >
                        The scan that is the starting point of a 'diff' check.
                        Defaults to the previous scan of the current branch.
                      example:
                        branch: main
                target:
                  allOf:
                    - $ref: '#/components/schemas/AppScanCheckScan'
                    - type: object
                      description: >
                        The focus of the check. Defaults to the last scan of the
                        default branch.
                      example:
                        branch: feature-branch
                rules:
                  description: |
                    The rules to apply. Note that ID must be unique.
                  type: array
                  items:
                    type: object
                    required:
                      - id
                    properties:
                      id:
                        type: string
                        description: |
                          A unique identifier for this rule.
                        example: no-crits
                      tags:
                        type: object
                        description: >
                          The series of filters that determine when the rule
                          applies. For each key in the object, a finding must
                          have one of the attributes listed in the key's values
                          for a match to be made.
                        additionalProperties:
                          type: array
                          items:
                            type: string
                        example:
                          severity:
                            - critical
                      threshold:
                        type: integer
                        minimum: 0
                        description: >
                          The maximum number of matches that can be made before
                          this rule fails.
                      num_findings:
                        type: integer
                        minimum: 0
                        maximum: 100
                        description: >
                          The maximum number of findings to return for this rule
                          (defaults to the value from `/meta/num_findings`).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - response
                    properties:
                      response:
                        $ref: '#/components/schemas/AppScanCheckResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
