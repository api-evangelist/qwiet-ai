      type: array
      items:
        $ref: '#/components/schemas/AppSpec'
    AppProvisionResponse:
      type: object
      description: contains the results of a bulk apps provisioning.
      properties:
        apps:
          type: array
          items:
            $ref: '#/components/schemas/AppSpec'
        rejected_ids:
          type: array
          description: >-
