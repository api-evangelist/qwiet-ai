openapi: 3.0.0
servers:
  - url: https://app.shiftleft.io/api/v4
info:
  x-logo:
    url: https://docs.shiftleft.io/img/sl-logo.svg
  version: 4.0.0
  title: API
  description: >
    The Qwiet API allows you to programmatically interact with Qwiet. You can
    manage users and their roles and get scan-related information, such as which
    applications were scanned and what vulnerabilities were identified by Qwiet
    as being present. You can also compare scans to see changes to your
    applications over time.


    # Authentication


    Use of the Qwiet API requires an access token, which is available via the
    [Qwiet UI](https://app.shiftleft.io/user/profile).
tags:
  - name: alerting
    x-displayName: Alerting
    description: |
      Notification and alerting related endpoints (such as webhooks)
  - name: app_groups
    x-displayName: App groups
    description: >
      The user-created groups of applications.


      [![Run in
      Postman](https://run.pstmn.io/button.svg)](https://god.gw.postman.com/run-collection/9829310-3251cbed-4ae3-4b06-8cad-c8748e49c7ec?action=collection%2Ffork&collection-url=entityId%3D9829310-3251cbed-4ae3-4b06-8cad-c8748e49c7ec%26entityType%3Dcollection%26workspaceId%3Da63f69cc-5c31-4f2b-8d28-b647f83b9e97)
  - name: app_labels
    x-displayName: App labels
    description: >
      The user-created application labels.


      [![Run in
      Postman](https://run.pstmn.io/button.svg)](https://god.gw.postman.com/run-collection/30743751-da3c929b-651f-414c-993c-ee2b2573b2f4?action=collection%2Ffork&collection-url=entityId%3D30743751-da3c929b-651f-414c-993c-ee2b2573b2f4%26entityType%3Dcollection%26workspaceId%3Da63f69cc-5c31-4f2b-8d28-b647f83b9e97)
  - name: apps
    x-displayName: Applications
    description: >
      The applications submitted for analysis.


      [![Run in
      Postman](https://run.pstmn.io/button.svg)](https://god.gw.postman.com/run-collection/9829310-e9d0bf19-30bd-46f4-b40c-9df03d2a463a?action=collection%2Ffork&collection-url=entityId%3D9829310-e9d0bf19-30bd-46f4-b40c-9df03d2a463a%26entityType%3Dcollection%26workspaceId%3Da63f69cc-5c31-4f2b-8d28-b647f83b9e97)
  - name: autofix
    x-displayName: AutoFix
    description: >
      The AutoFix suggestions for findings in applications. Harness SAST and SCA
      AutoFix uses large language models (LLMs) to generate potential code fix
      suggestions for findings produced by Qwiet AI by Harness analyses.


      [![Run in
      Postman](https://run.pstmn.io/button.svg)](https://god.gw.postman.com/run-collection/30743751-b06912bf-f25e-46a3-92c1-c12ba2ef162a?action=collection%2Ffork&collection-url=entityId%3D30743751-b06912bf-f25e-46a3-92c1-c12ba2ef162a%26entityType%3Dcollection%26workspaceId%3Da63f69cc-5c31-4f2b-8d28-b647f83b9e97)
  - name: azureboard
    x-displayName: Azure Boards
    description: |
      The endpoints to manage the Azure Boards integration.
  - name: branches
    x-displayName: Branches
    description: |
      The branch information for scans of applications.
  - name: comments
    x-displayName: Comments
    description: >
      The text threads (with individual comments ordered by time) attached to
      findings.


      [![Run in
      Postman](https://run.pstmn.io/button.svg)](https://god.gw.postman.com/run-collection/9829310-49dbc330-9cb4-4dac-9257-a9cc79b1103c?action=collection%2Ffork&collection-url=entityId%3D9829310-49dbc330-9cb4-4dac-9257-a9cc79b1103c%26entityType%3Dcollection%26workspaceId%3Da63f69cc-5c31-4f2b-8d28-b647f83b9e97)
  - name: compounds
    x-displayName: Multi-Language Apps
    description: >
      Multi-Language Apps are groups of applications that are scanned together
      as a single application. This is useful for applications that are a
      compound of various programming languages and configurations of
      frameworks.
  - name: findings
    x-displayName: Findings
    description: >
      The results of a scan (which can include vulnerabilities, secrets, or
      insights).

      [![Run in
      Postman](https://run.pstmn.io/button.svg)](https://god.gw.postman.com/run-collection/9829310-156075f8-c7cf-4e2c-95fa-0823a3313658?action=collection%2Ffork&collection-url=entityId%3D9829310-156075f8-c7cf-4e2c-95fa-0823a3313658%26entityType%3Dcollection%26workspaceId%3Da63f69cc-5c31-4f2b-8d28-b647f83b9e97)
  - name: org_backup
    x-displayName: Organization Backup
    description: |
      The endpoints for downloading backups of an organization's data.
  - name: orgs
    x-displayName: Organizations
    description: >
      The logical grouping (e.g., tenant/account) within Qwiet that defines a
      set of users, teams, and applications.


      [![Run in
      Postman](https://run.pstmn.io/button.svg)](https://god.gw.postman.com/run-collection/9829310-f0ae38d5-6c27-41a9-a1c3-9721d39f5df0?action=collection%2Ffork&collection-url=entityId%3D9829310-f0ae38d5-6c27-41a9-a1c3-9721d39f5df0%26entityType%3Dcollection%26workspaceId%3Da63f69cc-5c31-4f2b-8d28-b647f83b9e97)
  - name: rbac
    x-displayName: RBAC (users and teams)
    description: >
      Roles-based access control (RBAC) allows you to control the permissions
      users in an organization are granted.


      The permissions granted to a user are additive. The base level of a user's
      permission is determined by their role in the organization.


      A team represents a group of users and the applications that group of
      users can access. Users are granted additional permissions based on their
      team role.


      Users can belong to multiple teams, but an application can only belong to
      one team.


      You can use the `TEAM_DEFINED` organization role to limit user access to
      only the apps assigned to their team.


      [![Run in
      Postman](https://run.pstmn.io/button.svg)](https://god.gw.postman.com/run-collection/9829310-c002d05e-2fae-4914-8629-54cff59e1e6b?action=collection%2Ffork&collection-url=entityId%3D9829310-c002d05e-2fae-4914-8629-54cff59e1e6b%26entityType%3Dcollection%26workspaceId%3Da63f69cc-5c31-4f2b-8d28-b647f83b9e97)
  - name: reports
    x-displayName: Reports
    description: >
      The summaries of applications and their findings for a specific
      organization.


      [![Run in
      Postman](https://run.pstmn.io/button.svg)](https://god.gw.postman.com/run-collection/9829310-b675d7af-bdd5-49a4-982b-4e57c4f4a44c?action=collection%2Ffork&collection-url=entityId%3D9829310-b675d7af-bdd5-49a4-982b-4e57c4f4a44c%26entityType%3Dcollection%26workspaceId%3Da63f69cc-5c31-4f2b-8d28-b647f83b9e97)
  - name: SAML
    x-displayName: SAML
    description: >
      The integration endpoints allowing orgs to configure Qwiet to act as a
      SAML service provider (SP) that uses the customer's identity provider
      (IdP) to log users in.


      [![Run in
      Postman](https://run.pstmn.io/button.svg)](https://god.gw.postman.com/run-collection/9829310-a411d1c3-c232-4843-a89d-b302df399d99?action=collection%2Ffork&collection-url=entityId%3D9829310-a411d1c3-c232-4843-a89d-b302df399d99%26entityType%3Dcollection%26workspaceId%3Da63f69cc-5c31-4f2b-8d28-b647f83b9e97)
  - name: sarif
    x-displayName: SARIF
    description: >
      The integration endpoints for generating and downloading SARIF reports for
      applications.
  - name: saved_searches
    x-displayName: Saved Searches
    description: >
      The saved searches endpoints allow users to save specific search queries
      for organization and app findings
  - name: sca
    x-displayName: SCA
    description: >
      The summaries of software composition analysis (SCA) results for apps in
      an organization.


      [![Run in
      Postman](https://run.pstmn.io/button.svg)](https://god.gw.postman.com/run-collection/30743751-08a1d64d-5913-409a-ac8a-7074ce5a62d7?action=collection%2Ffork&collection-url=entityId%3D30743751-08a1d64d-5913-409a-ac8a-7074ce5a62d7%26entityType%3Dcollection%26workspaceId%3Da63f69cc-5c31-4f2b-8d28-b647f83b9e97)
  - name: scans
    x-displayName: Scans
    description: >
      The instances where Qwiet AI by Harness is invoked to identify findings in
      an application.


      [![Run in
      Postman](https://run.pstmn.io/button.svg)](https://god.gw.postman.com/run-collection/9829310-dc6a68d5-995d-4ba4-8098-e3b67773cf0e?action=collection%2Ffork&collection-url=entityId%3D9829310-dc6a68d5-995d-4ba4-8098-e3b67773cf0e%26entityType%3Dcollection%26workspaceId%3Da63f69cc-5c31-4f2b-8d28-b647f83b9e97)
  - name: scopes
    x-displayName: Scopes
    description: >
      Scopes define the type of resource and the operation that you can perform
      with the access token you bear. For example, `scans:create` means that the
      bearer of the token with this scope can create scans via the API.


      For each endpoint, we indicate the scope required to perform an operation
      under **Authorizations**.


      We also offer helper endpoints that allow you to determine what the
      allowed scopes for your access token are in the context of a specific API
      resource.


      [![Run in
      Postman](https://run.pstmn.io/button.svg)](https://god.gw.postman.com/run-collection/9829310-54d0d8f3-0cc0-42c3-8eee-2eb66e1ea835?action=collection%2Ffork&collection-url=entityId%3D9829310-54d0d8f3-0cc0-42c3-8eee-2eb66e1ea835%26entityType%3Dcollection%26workspaceId%3Da63f69cc-5c31-4f2b-8d28-b647f83b9e97)
  - name: slack
    x-displayName: Slack
    description: |
      The integration endpoints enabling users to set up a Slack integration.
  - name: team_config
    x-displayName: Team configuration
    description: |
      The endpoints to manage team-level configuration.
  - name: tokens
    x-displayName: Access tokens
    description: >
      Used to authenticate with the API.


      Can be issued by org admins. Each access token is owned by the org that
      issued it.


      [![Run in
      Postman](https://run.pstmn.io/button.svg)](https://god.gw.postman.com/run-collection/9829310-0a2fce9d-f679-41e8-a438-bcf13ddec403?action=collection%2Ffork&collection-url=entityId%3D9829310-0a2fce9d-f679-41e8-a438-bcf13ddec403%26entityType%3Dcollection%26workspaceId%3Da63f69cc-5c31-4f2b-8d28-b647f83b9e97)
  - name: users
    x-displayName: Users
    description: >
      Users pertains the users in general as qwiet.ai users and of each org as
      organization users.
  - name: versions
    x-displayName: Versions
    description: >
      The specific instances of an application scanned using Qwiet AI by
      Harness.

      [![Run in
      Postman](https://run.pstmn.io/button.svg)](https://god.gw.postman.com/run-collection/9829310-d8e4a6f2-bdce-4807-a8ca-74fc00dbc089?action=collection%2Ffork&collection-url=entityId%3D9829310-d8e4a6f2-bdce-4807-a8ca-74fc00dbc089%26entityType%3Dcollection%26workspaceId%3Da63f69cc-5c31-4f2b-8d28-b647f83b9e97)
  - name: wiz
    x-displayName: Wiz
    description: |
      The endpoints to manage the Wiz integration.
paths:
  /user:
    get:
      tags:
        - users
      summary: Read user and their organization information.
      operationId: ReadUser
      description: |
        Read the user and their organization membership and invites information.
      security:
        - BearerToken: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - response
                    properties:
                      response:
                        $ref: '#/components/schemas/UserMembershipInfo'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orgs/{orgID}/audit/csv/{auditYear}/{auditMonth}:
    parameters:
      - $ref: '#/components/parameters/orgID'
      - $ref: '#/components/parameters/auditYear'
      - $ref: '#/components/parameters/auditMonth'
    get:
      tags:
        - orgs
      summary: Download audit log CSV
      operationId: DownloadAuditLog
      description: >
        Download the CSV formatted audit log for an organization for a specific
        month. This feature is disabled by default. Contact Qwiet AI Customer
        Success to enable it.
      security:
        - BearerToken:
            - org_audit_trail:read
      responses:
        '200':
          description: Success
          content:
            application/csv:
              schema:
                type: string
  /orgs/{orgID}/audit/csv/{auditYear}/{auditMonth}/{auditDay}:
    parameters:
      - $ref: '#/components/parameters/orgID'
      - $ref: '#/components/parameters/auditYear'
      - $ref: '#/components/parameters/auditMonth'
      - $ref: '#/components/parameters/auditDay'
    get:
      tags:
        - orgs
      summary: Download Daily CSV audit log
      operationId: DownloadDailyAuditLog
      description: >
        Download the CSV formatted audit log for an organization for a specific
        day. This feature is disabled by default. Contact Qwiet AI Customer
        Success to enable it.
      security:
        - BearerToken:
            - org_audit_trail:read
      responses:
        '200':
          description: Success
          content:
            application/csv:
              schema:
                type: string
  /orgs/{orgID}/checkanalysis/policies/{reference}:
    parameters:
      - $ref: '#/components/parameters/orgID'
      - $ref: '#/components/parameters/reference'
    put:
      tags:
        - orgs
      summary: Upsert check-analysis Configuration
      operationId: UpsertCheckAnalysisConfiguration
      description: >
        Upload configuration file for the `check-analysis` server-side
        configuration and

        returns the hash of the uploaded file when successful.

        The reference here takes no tag, just a name.
      parameters:
        - $ref: '#/components/parameters/checkAnalysisTags'
        - $ref: '#/components/parameters/useDefaults'
      security:
        - BearerToken:
            - check_analysis_configuration:write
      requestBody:
        content:
          application/yaml:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - response
                    properties:
                      response:
                        type: object
                        required:
                          - contentHash
                          - tags
                        properties:
                          contentHash:
                            type: string
                          tags:
                            type: array
                            items:
                              type: string
              example:
                ok: true
                response:
                  contentHash: >-
                    cf070ba492a9ec9d411e615e7399c0c94d11be0888862c5385b7184a5da53ec7
                  tags:
                    - v1
                    - v2
                    - latest
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - orgs
      summary: Resolve check-analysis Configuration
      operationId: ResolveCheckAnalysisConfiguration
      description: >
        Resolve the given reference (name plus a tag, which is usually a version
        number) and

        return the raw file back to the caller.
      security:
        - BearerToken:
            - check_analysis_configuration:read
      responses:
        '200':
          description: Success
          content:
            application/yaml:
              schema:
                type: string
                format: binary
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orgs/{orgID}/checkanalysis/policies:
    parameters:
      - $ref: '#/components/parameters/orgID'
    get:
      tags:
        - orgs
      summary: List check-analysis Configurations
      operationId: ListCheckAnalysisConfiguration
      description: |
        List all check-analysis configurations for the given
      security:
        - BearerToken:
            - check_analysis_configuration:list
      parameters:
        - name: name
          in: query
          description: >-
            Any names to filter for, only those policies tagged with these names
            will be returned
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - response
                    properties:
                      response:
                        type: array
                        items:
                          type: object
                          required:
                            - contentHash
                            - tags
                          properties:
                            contentHash:
                              type: string
                            tags:
                              type: array
                              items:
                                type: object
                                required:
                                  - name
                                  - tags
                                properties:
                                  name:
                                    type: string
                                  tags:
                                    type: array
                                    items:
                                      type: string
              example:
                ok: true
                response:
                  - contentHash: >-
                      18269b4a713bfc9aa8e8c74d9b9c6a5ced89b4d46364644e2ede7ffa39f54aa9
                    tags:
                      - name: blah
                        tags:
                          - latest
                          - v1
                          - v2
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orgs/{orgID}/my_scopes:
    parameters:
      - $ref: '#/components/parameters/orgID'
    get:
      tags:
        - scopes
      summary: List user's org scopes
      operationId: ListMyOrgScopes
      description: >
        Return a list of the scopes the user's bearer token is allowed to
        perform in the context of an org.
      security:
        - BearerToken: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - response
                    properties:
                      response:
                        type: array
                        items:
                          $ref: '#/components/schemas/Scope'
              example:
                ok: true
                response:
                  - teams:read
                  - apps:list
                  - github:install
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orgs/{orgID}/apps/{appID}/my_scopes:
    parameters:
      - $ref: '#/components/parameters/orgID'
      - $ref: '#/components/parameters/appID'
    get:
      tags:
        - scopes
      summary: List user's app scopes
      operationId: ListMyAppScopes
      description: >
        Return a list of scopes the user is allowed to perform in the context of
        an app.
      security:
        - BearerToken: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - response
                    properties:
                      response:
                        type: array
                        items:
                          $ref: '#/components/schemas/Scope'
              example:
                ok: true
                response:
                  - scans:read
                  - findings:list
                  - findings:read
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orgs/{orgID}/rbac/teams/{rbacTeamID}/my_scopes:
    parameters:
      - $ref: '#/components/parameters/orgID'
      - $ref: '#/components/parameters/rbacTeamID'
    get:
      tags:
        - scopes
      summary: List user's team scopes
      operationId: ListMyTeamScopes
      description: >
        Return a list of scopes the user is allowed to perform in the context of
        their team.
      security:
        - BearerToken: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - response
                    properties:
                      response:
                        type: array
                        items:
                          $ref: '#/components/schemas/Scope'
              example:
                ok: true
                response:
                  - roles:read
                  - team:read
                  - team:update
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orgs/{orgID}/roles:
    parameters:
      - $ref: '#/components/parameters/orgID'
    get:
      tags:
        - tokens
      summary: List access token roles
      operationId: ListRoles
      description: >
        Return a list of roles an that are assigned to an access token and are
        available for use (includes only the roles that are managed by Qwiet).
      security:
        - BearerToken:
            - roles:list
      parameters:
        - $ref: '#/components/parameters/orgID'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - response
                    properties:
                      response:
                        type: array
                        items:
                          $ref: '#/components/schemas/Role'
              example:
                ok: true
                response:
                  - id: 5b588f3a-7fe0-444d-afbb-c0d5ee04139b
                    label: Jira plugin
                    description: >-
                      This role grants the token permissions required for the
                      Qwiet Jira Plugin.
                    role_type: managed
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orgs/{orgID}/rbac/roles:
    parameters:
      - $ref: '#/components/parameters/orgID'
    get:
      tags:
        - rbac
      summary: List roles
      operationId: ListOrgRBACRoles
      description: >
        Return a list of roles an org has available to use (includes only the
        roles that are managed by Qwiet). Note that the ID and role ID for a CI
        token are also used for access tokens. The ID and role ID for an
        integration token are also used for a Jira integration token.
      security:
        - BearerToken:
            - roles:list
      parameters:
        - $ref: '#/components/parameters/orgID'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - response
                    properties:
                      response:
                        type: array
                        items:
                          $ref: '#/components/schemas/RBACRole'
              example:
                ok: true
                response:
                  - description: ''
                    id: e7ca42af-8dd5-4928-8eb9-28d5e41b5564
                    id_aliases:
                      - MEMBER
                      - TEAM_MEMBER
                    name: Member
                    scopes:
                      - apps:list
                      - cold_start_subscription:read
                      - cold_start_subscription:update
                      - findings:list
                      - kontra:login
                      - kontra:read
                      - org:read
                      - org_inspect_configuration:validate
                      - org_user_notification:create
                      - org_user_notification:delete
                      - org_user_notification:read
                      - org_user_notification:update
                      - roles:list
                      - subscriptions:read
                  - description: ''
                    id: c46b7cba-6726-11eb-8232-e3aecb012972
                    id_aliases:
                      - LEGACY_COLLABORATOR
                    name: Collaborator
                    scopes:
                      - apps:list
                      - findings:list
                      - findings:read
                      - kontra:login
                      - kontra:read
                      - metrics:write
                      - org:read
                      - org_inspect_configuration:validate
                      - org_invitations:list
                      - org_runs:create
                      - org_runs:read
                      - org_user_notification:create
                      - org_user_notification:delete
                      - org_user_notification:read
