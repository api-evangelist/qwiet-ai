  /orgs/{orgID}/compounds/named/{compoundName}/sca/packages:
    parameters:
      - $ref: '#/components/parameters/orgID'
      - $ref: '#/components/parameters/compoundName'
    get:
      tags:
        - findings
        - sca
      summary: Read the SCA packages of a compound scan
      operationId: ReadCompoundSCAPackages
      description: Return information about the packages found in a scan of an app
      security:
        - BearerToken:
            - sca:read
      parameters:
        - in: query
          name: polyglot_scan
          description: >-
            Polyglot scan ID of the scan to filter to; defaults to the latest
            scan.
          example: 42
          schema:
            type: integer
        - in: query
          name: scan_version
          description: >-
            The version of which to get the latest scan. This is usually a SHA1.
            Ignored if polyglot_scan is given.
          example: 9b7e138e1b16dc5261803cceffb86c36800c2c7f
          schema:
            type: string
        - in: query
          name: scan_branch
          description: >-
            The branch of which to get the latest scan. Ignored if polygot_scan
            or scan_version are given.
          example: feature/1234
          schema:
            type: string
        - in: query
          name: scan_tag
          description: >-
            Tags passed to the analyzer at scan time. Ignored if polygot_scan,
            scan_version, or scan_branch are given.
          schema:
            type: string
            pattern: ^(?<key>.*?)__eq__(?<value>.*)$
        - in: query
          name: scan_platform
          description: >-
            The analysis platform. Cannot be specified together with
            scan_language.
          schema:
            $ref: '#/components/schemas/ScanPlatform'
        - in: query
          name: scan_language
          description: >-
            The analysis language. Cannot be specified together with
            scan_platform.
          schema:
            $ref: '#/components/schemas/ScanLanguage'
        - in: query
          name: type
          description: The package finding types to include.
          example: package
          schema:
            type: string
            enum:
              - package
              - container_package
        - in: query
          name: tag
          description: a tag query used to filter the findings
          example: package_type__eq__alpine
          schema:
            type: string
        - in: query
          name: per_page
          description: The number of results per page.
          schema:
            type: integer
            minimum: 1
            default: 100
            maximum: 10000
        - in: query
          name: page
          description: The specific page of the results to fetch.
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: sort
          description: How to sort results; defaults to ID
          schema:
            type: string
            enum:
              - package
              - url
              - name
              - namespace
              - type
              - version
              - license
              - created_at
              - num_vulns
              - num_reachable
              - num_exploitable
        - $ref: '#/components/parameters/order'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - response
                    properties:
                      response:
                        type: object
                        required:
                          - packages
                          - total_count
                          - has_more
                          - scans
                        properties:
                          packages:
                            type: array
                            items:
                              $ref: '#/components/schemas/SCAPackage'
                          has_more:
                            type: boolean
                            example: true
                            description: >-
                              Whether asking for the next page would give you
                              more results
                          total_count:
                            type: integer
                            example: 42
                            description: The total number of results available
                          compound_id:
                            type: string
                            description: The compound ID, if this is a compound endpoint
                            example: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                          polyglot_scan_id:
                            type: string
                            description: The polyglot scan ID selected for this response
                            example: '1'
                          scans:
                            type: array
                            description: >-
                              The scans whose packages are included in this
                              response
                            items:
                              type: object
                              required:
                                - id
                                - app
                              properties:
                                id:
                                  type: string
                                  description: The scan ID
                                  example: '1234'
                                app:
                                  type: string
                                  description: The project ID for this scan
                                  example: hello-qwiet
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
