    RegisterWebhookRequest:
      type: object
      required:
        - url
        - events
      properties:
        url:
          type: string
          format: uri
          description: The URL to which the webhook should send events
        events:
          type: array
          items:
            type: object
            required:
              - name
            properties:
              name:
                type: string
                enum:
                  - scan.finished
