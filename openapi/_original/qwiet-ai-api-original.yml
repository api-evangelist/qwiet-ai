          enum:
            - initialized
            - in_progress
            - cancelled
            - completed
            - failed
            - timed_out
        status:
          type: string
          description: The status message set on the last state update
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: A rough estimate of the progress of the overall scan process
        timestamp:
          type: string
          format: date-time
          description: The date and time of the last status update
    ExternalScanStatusUpdate:
      type: object
      required:
        - kind
        - status
      properties:
        kind:
          type: string
          description: The type of status update
          enum:
            - start
            - update
            - finish
            - cancel
            - fail
        status:
          type: string
          description: The actual status message to be set
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: The overall progress of the scan
    ExternalScan:
      type: object
      required:
        - version
        - language
        - application
      properties:
        application:
          type: string
          description: >-
            The name of the application to which this scan belongs (will be
            created if it doesn't already exist)
        version:
          type: string
          description: The app version represented by this scan
        language:
          type: string
          description: The language of the analyzed application
        tags:
          type: object
          description: The tags associated with this scan
        app_tags:
          type: object
          description: The tags associated with the application being scanned
    Role:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: string
              format: uuid
        - $ref: '#/components/schemas/NewRole'
    NewRole:
      type: object
      required:
        - label
        - description
      properties:
        label:
          type: string
          description: The user-defined label used to identify the token
        description:
          type: string
          description: >-
            The user-defined description that describes why this role was
            created and how it should be used
        role_type:
          type: string
          enum:
            - managed
            - org
          description: |
            Whether this role is a managed role or an org role:
              - Managed roles are maintained by Qwiet
              - Org roles are created/maintained by a customer's organization admin
    Scope:
      type: string
      pattern: ^\w+:\w+$|^\w+:\*$
    RoleType:
      type: string
      enum:
        - team
        - organization
        - qwiet
      example: team
      description: >-
        The type of role. This is used to categorize roles and determine in what
        context they can be used. Team roles can only be used in teams,
        organization roles can be used across the organization, and qwiet roles
        are predefined roles. Note that 'qwiet' type is reserved for
        system-defined roles and cannot be used when creating or updating custom
        roles.
    ResourceType:
      type: string
      enum:
        - organization
        - application
        - organization_user
        - team
      description: The type of resource to which the role applies
