                example: GHSA-gwrp-pvrq-jmwv
              assigner:
                type: string
                example: GitHub
              cweIds:
                type: array
                items:
                  type: string
                example:
                  - CWE-20
                  - CWE-22
              references:
                type: array
                items:
                  type: object
                  properties:
                    url:
                      type: string
                    name:
                      type: string
                    refsource:
                      type: string
                    tags:
                      type: array
                      items:
                        type: string
              descriptions:
                type: array
                items:
                  type: object
                  properties:
                    lang:
                      type: string
                    value:
                      type: string
              impact:
                type: object
