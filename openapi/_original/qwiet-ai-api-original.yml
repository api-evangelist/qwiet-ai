components:
  securitySchemes:
    BearerToken:
      description: >
        Use of the Qwiet API requires an access token, which is available via
        the Qwiet Dashboard (either under [Account
        Settings](https://app.shiftleft.io/user/profile) or [Integration
        Tokens](https://app.shiftleft.io/integrations)) or via the `/tokens`
        endpoints. You can pass an access token to the API using the HTTP
        `Authorization` Request header as follows:\

        `Authorization: Bearer {access token}`
      type: http
      scheme: bearer
  parameters:
    comparableVersionIdentifierSource:
      name: source
      in: query
      required: true
      description: The source scan for a comparison
      schema:
        type: string
        pattern: ^scan\.\d+|tag\.\w=\w$
        example: scan.128|tag.branch=samplebranch
    optionalComparableVersionIdentifierSource:
      name: source
      in: query
      description: The source scan for a comparision
      schema:
        type: string
        pattern: ^scan\.\d+|tag\.\w=\w$
        example: scan.128|tag.branch=samplebranch
    comparableVersionIdentifierTarget:
      name: target
      in: query
      required: true
      description: The target scan for a comparison
      schema:
        type: string
        pattern: ^scan\.\d+|tag\.\w=\w$
        example: scan.128|tag.branch=samplebranch
    appGroupName:
      name: appGroupName
      in: path
      description: The group name
      required: true
      schema:
        type: string
    orgID:
      name: orgID
      in: path
      description: The org ID
      required: true
      schema:
        type: string
        format: uuid
    compoundID:
      name: compoundID
      in: path
      description: A compound's ID
      required: true
      schema:
        type: string
        format: uuid
    compoundName:
      name: compoundName
      in: path
      description: A compound's name
      required: true
      schema:
        type: string
    cveID:
      name: cveID
      in: path
      description: The CVE ID
      required: true
      schema:
        type: string
        pattern: ^[a-zA-Z0-9_-]+$
        example: CVE-2020-12475
    rbacTeamID:
      name: rbacTeamID
      in: path
      description: The team ID
      required: true
      schema:
        type: string
        format: uuid
    rbacRoleID:
      name: rbacRoleID
      in: path
      description: The role ID
      required: true
      schema:
        type: string
        format: uuid
    groupID:
      name: groupID
      in: path
      description: A human group's ID
      required: true
      schema:
        type: string
        format: uuid
    humanGroupName:
      name: name
      in: query
      description: The human group name, case sensitive
      required: false
      schema:
        type: string
    humanGroupNameI:
      name: iname
      in: query
      description: The human group name, case insensitive
      required: false
      schema:
        type: string
    humanGroupSearch:
      name: search
      in: query
      description: >
        Case-insensitive substring search on the human group name. Mutually
        exclusive with `name` and `iname`.
      required: false
      schema:
        type: string
    appID:
      name: appID
      in: path
      description: The app ID (e.g., `HelloQwiet`)
      required: true
      schema:
        type: string
    userIDv2:
      name: userIDv2
      in: path
      description: The user's ID
      required: true
      schema:
        type: string
        format: uuid
    email:
      name: email
      in: query
      description: >
        Exact email lookup. When present, returns users matching the given
        address(es) instead of listing the organization. Mutually exclusive with
        `search`.
      required: false
      schema:
        type: string
        format: email
    rbacUserSearch:
      name: search
      in: query
      description: >
        Case-insensitive substring search on the user's display name or email
        address. Mutually exclusive with `email`.
      required: false
      schema:
        type: string
        maxLength: 320
        minLength: 1
    rbacUserTeam:
      name: team
      in: query
      description: >
        Restrict results to members of the team with this ID. Composes with
        `search`, `sort`, and `order`. When no user matches, the response is an
        empty list rather than a 404.
      required: false
      schema:
        type: string
        format: uuid
    rbacUserSort:
      name: sort
      in: query
      description: |
        Field to sort results by. Defaults to `email` when omitted.
      required: false
      schema:
        type: string
        enum:
          - name
          - email
          - role
          - joined
    rbacUserOrder:
      name: order
      in: query
      description: |
        Sort direction. Defaults to ascending when omitted.
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
    rbacInvitationSearch:
      name: search
      in: query
      description: >
        Case-insensitive substring search on the invitee's name or email
        address.
      required: false
      schema:
        type: string
        maxLength: 320
        minLength: 1
    rbacInvitationSort:
      name: sort
      in: query
      description: >
        Field to sort results by. Defaults to `email` when omitted. `invited`
        sorts by the time the invitation was created.
      required: false
      schema:
        type: string
        enum:
          - name
          - email
          - invited
    findingID:
      name: findingID
      in: path
      description: The finding ID
      required: true
      schema:
        type: string
    commentID:
      name: commentID
      in: path
      description: The comment ID
      required: true
      schema:
        type: string
    versionID:
      name: versionID
      in: path
      description: The version ID (e.g., `7d0...8b10`)
      required: true
      schema:
        type: string
    findingTagKey:
      name: findingTagKey
      in: path
      description: The finding's tag key
      required: true
      schema:
        type: string
    groupByKey:
      name: groupByKey
      in: path
      description: The group by key
      required: true
      schema:
        type: string
    tags:
      name: tags
      in: query
      description: The scan tags to filter by (e.g., `branch=main`)
      schema:
        items:
          type: string
    finding_tags:
      name: finding_tags
      in: query
      description: The findings' filtering tag
      schema:
        items:
          type: string
          example: category=XSS
    type:
      in: query
      name: type
      description: >-
        The type of findings. Accepted values are `oss_vuln`, `vuln`, and
        `secret`
      schema:
        type: string
    severity:
      in: query
      name: severity
      description: The severity filter
      schema:
        $ref: '#/components/schemas/Severity'
    category:
      name: category
      in: query
      description: The category filter
      schema:
        type: string
    details_tags:
      name: details_tags
      in: query
      description: The filter for the finding's details tags
      style: form
      schema:
        items:
          type: string
    assignee:
      name: assignee
      in: query
      description: The email addresses of users assigned to this finding
      schema:
        type: string
    assignment:
      in: query
      name: assignment
      description: >
        The assignment status filter. By default, all findings, both
        `unassigned` and `assigned`, are returned.
      schema:
        $ref: '#/components/schemas/Assignment'
    status:
      in: query
      name: status
      description: |
        The status filter. By default, only `unset` findings are included.
      schema:
        $ref: '#/components/schemas/Status'
    sort:
      in: query
      name: sort
      description: How to sort results; defaults to ID
      schema:
        type: string
    order:
      in: query
      name: order
      description: Direction of the sort; defaults to descending
      schema:
        type: string
        enum:
          - desc
          - asc
    page:
      in: query
      name: page
      description: >
        The page of results to fetch. Results are not guaranteed to be
        deterministic using this approach; we recommended using the `next_page`
        URL in a paginated response
      schema:
        type: integer
    per_page:
      in: query
      name: per_page
      description: Number of results per page; defaults to 50
      schema:
        type: integer
    only_counts:
      in: query
      name: only_counts
      description: Whether to include only finding counts; excludes the list of findings
      schema:
        type: boolean
    default_branch:
      in: query
      name: default_branch
      description: Return findings from scans of the app's configured default branch
      schema:
        type: boolean
    search:
      in: query
      name: search
      description: Search filter that looks for matches in finding titles and tags
      schema:
        type: string
    recursive:
      in: query
      name: recursive
      description: Whether to perform an action recursively.
      schema:
        type: boolean
    teamName:
      name: name
      in: query
      description: >
        Filter the listing to teams whose name matches this value
        case-insensitively. The legacy `teamName` spelling is accepted as an
        alias and used only when `name` is absent.
      schema:
        type: string
    noMembers:
      name: no_members
      in: query
      description: Indicates whether or not to include the team members in the response
      required: false
      schema:
        type: boolean
        enum:
          - true
    scanID:
      name: scanID
      in: path
      description: ID of the scan
      required: true
      schema:
        type: string
    SAMLConfigName:
      name: SAMLConfigName
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SAMLConfigName'
    ssoName:
      name: ssoName
      in: path
      description: Unique SSO name of the org
      required: true
      schema:
        type: string
    auditYear:
      name: auditYear
      in: path
      description: The year for a requested report
      required: true
      schema:
        type: number
    auditMonth:
      name: auditMonth
      in: path
      description: The month for a requested report
      required: true
      schema:
        type: number
    auditDay:
      name: auditDay
      in: path
      description: The day for a requested report
      required: true
      schema:
        type: number
    reportExtension:
      name: ext
      in: path
      description: the extension wanted
      required: true
      schema:
        type: string
        example: pdf
        enum:
          - html
          - pdf
    reference:
      name: reference
      in: path
      description: the reference
      required: true
      schema:
        type: string
    checkAnalysisTags:
      name: tag
      in: query
      description: the tags
      schema:
        type: string
    useDefaults:
      name: useDefaults
      in: query
      description: whether to apply the default versioning mechanism
      schema:
        type: boolean
    azureOrgName:
      name: azureOrgName
      in: path
      description: Azure org name
      required: true
      schema:
        type: string
    azureOrgProjectName:
      name: azureOrgProjectName
      in: path
      description: Azure organization project name
      required: true
      schema:
        type: string
    version:
      name: version
      in: query
      description: >-
        Webhook configuration version to use (1 = legacy flow, 2 = normal flow).
        Defaults to 2 (normal flow) if not specified.
      schema:
        type: integer
        enum:
          - 1
          - 2
        default: 2
        example: 2
  schemas:
    AnalyzeFailure:
      type: object
      description: A client-side analyze failure record
      required:
        - id
        - organization_id
        - app_name
        - category
        - message
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for this failure
        organization_id:
          type: string
          format: uuid
          description: The organization ID
        project_id:
          type: string
          format: uuid
          description: The project ID if available
        app_name:
          type: string
          description: The application name
        compound_id:
          type: string
          description: The compound ID if available
        polyglot_scan_id:
          type: integer
          description: The polyglot scan ID if available
        domain:
          type: string
          description: >-
            The component domain that generated the error (e.g., sl, java2cpg,
            py2cpg)
        category:
          type: string
          description: The failure category
          enum:
            - config_load
            - language_detection
            - language_exclusion
            - compound_guess
            - input_validation
            - auth_validation
            - remediation_config
            - project_creation
            - subscription_limit
            - cpg_generation
            - resource_download
            - sca_analysis
            - unknown
        code:
          type: string
          description: A machine-readable error code for programmatic handling
        affects:
          type: string
          description: What functionality is affected by this failure
          enum:
            - all
            - sast
            - sca
        message:
          type: string
          description: The error message
        is_partial:
          type: boolean
          description: Whether this is a partial failure (some analysis succeeded)
        details:
          type: object
          description: >-
            Additional structured details about the failure (includes
            sl_version, os, arch, log_trace, etc.)
        log_trace_s3_url:
          type: string
          description: S3 URL for longer log traces (when log_trace exceeds inline limit)
        created_at:
          type: string
          format: date-time
          description: The timestamp when the failure was recorded
    CommentRequest:
      type: object
      properties:
        comment:
          type: string
          description: The text of the comment
    Comment:
      type: object
      required:
        - id
        - created_at
        - app_id
        - org_id
        - finding_id
        - comment
      properties:
        id:
          type: string
          description: >-
            The unique ID of this comment; should only be used in conjunction
            with the finding ID
          example: '30'
        created_at:
          type: string
          description: The date on which this comment was posted
          format: date-time
        app_id:
          type: string
          description: The application ID for the finding where the comment was posted
          example: hsl
        org_id:
          type: string
          description: The ID of the organization
          example: 261f1203-748d-4010-a57d-4cf3107f8647
        finding_id:
          type: string
          description: The ID of the finding where this comment was posted
          example: '3'
        owner:
          type: object
          description: Information about the user that posted the comment
          properties:
            email:
              type: string
              description: The email of the comment author
            name:
              type: string
              description: The name of the comment author
        comment:
          type: string
          description: The text of the comment
    JiraIssueDetails:
      type: object
      properties:
        jira_issue_url:
          type: string
          description: The link to a JIRA project issue
          example: https://example.jira.com/project/PROJ001
        jira_issue_id:
          type: string
          description: >-
            The internal ID of a Jira project issue (may be needed to interact
            with JIRA)
          example: '10021'
        jira_issue_key:
          type: string
          description: >-
            The key of the Jira project issue; used to refer to the specific
            issue
          example: PROJ001
    ScanDiffFinding:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for this finding
          example: '1'
        app:
          type: string
          description: The app this finding belongs to
          example: hello-qwiet
        type:
          type: string
          description: The type of finding
          example: vuln
        title:
          type: string
          description: Title of the finding
          example: >-
            Sensitive Data Leak: Sensitive data contained in HTTP
            request/response
        description:
          type: string
          description: Description of the finding
          example: >-
            Sensitive data included in HTTP request/response. This could result
            in sensitive data exposure
        severity:
          $ref: '#/components/schemas/Severity'
        owasp_category:
          type: string
          description: The finding's OWASP category
          example: a3-sensitive-data-exposure
        category:
          type: string
          description: The finding category
          example: Sensitive Data Leak
        version_first_seen:
          type: string
          description: The app version when this finding was first identified
        details:
          type: object
          description: Specific details about the finding
        internal_id:
          type: string
          description: The internal violation ID for this finding. Do not use
          example: sensitive-to-http/f5ecc6f0cae821f47a06c939d1b9c7ee
        regression:
          type: boolean
          description: >-
            Indicates if this finding is considered a regression in the context
            of a scan
    ScanDiff:
      type: object
      properties:
        source:
          $ref: '#/components/schemas/ScanInfo'
        target:
          $ref: '#/components/schemas/ScanInfo'
        new:
          type: array
          items:
            $ref: '#/components/schemas/ScanDiffFinding'
        fixed:
          type: array
          items:
            $ref: '#/components/schemas/ScanDiffFinding'
        common:
          type: array
          items:
            $ref: '#/components/schemas/ScanDiffFinding'
    SuccessResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          description: Whether the request was successful or not
    StatusLog:
      type: object
      properties:
        message_id:
          type: string
        message:
          type: string
        gh_pr_link:
          type: string
    App:
      type: object
      example:
        id: shiftleft-python-demo
        name: shiftleft-python-demo
        can_delete: true
        is_subscription_active: true
        configuration:
          analysis_configuration:
            secrets: {}
            cpg2sp: {}
        avg_scan_duration_ms: 43674
        compound: fab0089f-cc8c-44a8-a927-26e83f6eb6d4
        labels:
          - label1
          - label2
      properties:
        id:
          type: string
          description: The name of the app
        name:
          type: string
          description: An alternative (human-readable) name for the app
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        is_demo:
          type: boolean
          description: Indicates whether the app was created as a demo or not
        potential_new_cves:
          type: integer
          description: The number of new CVEs found in a re-scan of the app
        team_id:
          type: string
          description: The name of the team this application belongs to, if any
        can_delete:
          type: boolean
          description: >-
            Indicates if the user making the request has deletion permissions on
            this App
        is_subscription_active:
          type: boolean
          description: Indicates if the organization subscription allows accessing this App
        latest_status_log:
          $ref: '#/components/schemas/StatusLog'
        avg_scan_duration_ms:
          type: integer
          description: >
            The average duration of (successful) scans for this project. Absent
            if no scans finished successfully yet.
        compound:
          type: string
          description: >-
            The id of the compound (multi language application) this app belongs
            to, if any.
        labels:
          type: array
          items:
            type: string
    WebhookConfigurationResponse:
      type: object
      properties:
        url:
          type: string
          description: The URL to which the webhook will be sent
        tokenID:
          type: string
          format: uuid
          description: >-
            The token ID to be used for the webhook (only present if token based
            authentication was used while regsistering the webhook)
        events:
          type: array
          items:
            type: string
          description: >-
            The events that are subscribed to this webhook url. A list of active
            events that can be fetched from the `/alerting/events` endpoint.
    WebhookTokenRenewMetadata:
      type: object
      properties:
        url:
          type: string
          description: The URL in which the token can be renewed
        method:
          type: string
          description: The method to be used for the renewal
        bodyFields:
          type: object
          description: The fields to be sent in the body and the values
        asJson:
          type: boolean
          description: Whether the body should be sent as JSON or FORM data
        forceFormUrlEncoding:
          type: boolean
          description: >-
            Whether the body should be sent as query arguments even if the
            method is POST
    TokenRenewalResponseHandling:
      type: object
      properties:
        tokenField:
          type: string
          description: The field in the response that contains the token
        ttlField:
          type: string
          description: >-
            The field in the response that contains the time to live of the
            token
        typeField:
          type: string
          description: >-
            The field in the response that contains the type of the token (only
            Bearer is supported for now)
    AuthenticatedWebHookTokenConfiguration:
      type: object
      description: Configuration for a webhook that requires a token
      properties:
        token:
          type: string
          description: The token to be used for the webhook
        renewalMetadata:
          $ref: '#/components/schemas/WebhookTokenRenewMetadata'
        responseHandling:
          $ref: '#/components/schemas/TokenRenewalResponseHandling'
    ScanPlatform:
      type: string
      description: The analysis platform identifier.
      enum:
        - java
        - go
        - csharp
        - javascript
        - c
        - python
        - terraform_hcl
        - ruby
        - php
        - fuzzytestlang
        - kotlin
        - javasrc
        - pythonsrc
        - jssrc
        - secrets
        - swiftsrc
        - plsql
        - apex
        - groovy
    ScanLanguage:
      type: string
      description: The analysis language identifier.
      enum:
        - java
        - go
        - csharp
        - javascript
        - c
        - python
        - terraform_hcl
        - ruby
        - php
        - fuzzytestlang
        - kotlin
        - swift
        - plsql
        - apex
        - groovy
    SASTVulnCounts:
      type: object
      required:
        - critical
        - high
        - medium
        - low
      properties:
        critical:
          type: integer
          description: the number of critical severity vulnerabilities
          example: 1
        high:
          type: integer
          description: the number of high severity vulnerabilities
          example: 2
        medium:
          type: integer
          description: the number of medium severity vulnerabilities
          example: 3
        low:
          type: integer
          description: the number of low severity vulnerabilities
          example: 5
    SCAVulnCounts:
      allOf:
        - $ref: '#/components/schemas/SASTVulnCounts'
        - type: object
          required:
            - unreachable
          properties:
            unreachable:
              type: integer
              description: the number of unreachable vulnerabilities
              example: 7
    SCAPackage:
      type: object
      required:
        - package
        - package_url
        - name
        - namespace
        - type
        - version
        - license
        - first_seen
        - total_vulns
        - total_reachable
        - total_exploitable
        - total_apps
        - risk_type
      description: Information about an SCA package
      properties:
        package:
          type: string
          description: The full package identifier (namespace/name)
          example: github.com/concourse/s3-resource
        package_url:
          type: string
          description: The package URL (PURL)
          example: pkg:golang/github.com/concourse/s3-resource@%28devel%29
        name:
          type: string
          description: The package name
          example: s3-resource
        namespace:
          type: string
          description: The package namespace
          example: github.com/concourse
        type:
          type: string
          description: The package type
          example: golang
        version:
          type: string
          description: The package version
          example: (devel)
        license:
          type: string
          description: The package license
          example: Apache-2.0
        first_seen:
          type: string
          format: date-time
          description: When the package was first seen
          example: '2023-05-26T15:04:07.278721+01:00'
        total_vulns:
          type: integer
          description: Total number of vulnerabilities
          example: 5
        total_reachable:
          type: integer
          description: Number of reachable vulnerabilities
          example: 3
        total_exploitable:
          type: integer
          description: Number of exploitable vulnerabilities
          example: 0
        total_apps:
          type: integer
          description: Number of applications this package appears in
          example: 2
        apps:
          type: array
          description: Application names where this package appears
          items:
            type: string
          example:
            - my-app
            - other-app
        vulns:
          type: array
          description: CVE identifiers of vulnerabilities affecting this package
          items:
            type: string
          example:
            - CVE-2021-23337
            - CVE-2020-28500
        reachable:
          type: array
          description: CVE identifiers of reachable vulnerabilities
          items:
            type: string
          example:
            - CVE-2021-23337
        exploitable:
          type: array
          description: CVE identifiers of exploitable vulnerabilities
          items:
            type: string
        risk_type:
          type: object
          description: OSS supply-chain risk indicators for this package
          properties:
            is_malicious:
              type: boolean
            is_squatted:
              type: boolean
            is_abandoned:
              type: boolean
            is_repo_hijackable:
              type: boolean
    StreamlinedScan:
      type: object
      required:
        - polyglot_scan_id
        - created_at
        - agent
        - branch
        - languages
        - vulns
        - oss_vulns
        - container_vulns
        - secrets
      properties:
        polyglot_scan_id:
          type: integer
          description: A polyglot scan's ID
          example: 1
        created_at:
          type: string
          format: date-time
          description: The timestamp of the scan
        agent:
          type: string
          description: The agent of the scan
          example: harness
        branch:
          type: string
          description: The branch of the scan
          example: feature/more-potatoes
        languages:
          type: array
          items:
            type: string
            description: The language of the scan
            example: javascript
        platforms:
          type: array
          items:
            type: string
            description: The platform code of the scan
            example: JAVASCRIPT
        vulns:
          $ref: '#/components/schemas/SASTVulnCounts'
        oss_vulns:
          $ref: '#/components/schemas/SCAVulnCounts'
        container_vulns:
          $ref: '#/components/schemas/SCAVulnCounts'
        secrets:
          type: integer
          description: the number of secrets
          example: 42
        oss_risks:
          type: integer
          description: the number of OSS dependency risks
          example: 3
        failures:
          type: array
          items:
            type: string
            description: a problem found in this polyglot scan
            example: Failed to create CPG File
    OSSRiskSummary:
      type: object
      description: >-
        Counts of dependency-level risks across an OSS scan: malicious packages,
        typosquats, abandoned packages, hijackable repos, end-of-life packages.
      properties:
        total_malicious:
          type: integer
          example: 1
        total_squatted:
          type: integer
          example: 0
        total_abandoned:
          type: integer
          example: 2
        total_repo_hijackable:
          type: integer
          example: 0
        total_eol:
          type: integer
          example: 1
    StreamlinedPackageCounts:
      type: object
      description: >-
        Counts of OSS and container packages aggregated across all successful
        project scans in a polyglot scan, with the count of those that have at
        least one vulnerability.
      required:
        - oss
        - vulnerable_oss
        - container
        - vulnerable_container
      properties:
        oss:
          type: integer
          description: Total number of OSS packages.
          example: 42
        vulnerable_oss:
          type: integer
          description: Number of OSS packages with at least one vulnerability.
          example: 7
        container:
          type: integer
          description: Total number of container packages.
          example: 18
        vulnerable_container:
          type: integer
          description: Number of container packages with at least one vulnerability.
          example: 2
    AnalysisStatusCounts:
      type: object
      description: >-
        Counts of compounds (and standalone apps) in each scan-analysis status
        bucket. The buckets correspond one-to-one with the `ScanAnalysisStatus`
        values reported by the non-aggregate streamlined endpoint.
      required:
        - successful
        - partially_successful
        - unsuccessful
        - incomplete
      properties:
        successful:
          type: integer
          description: Compounds whose analysis succeeded for this capability.
          example: 5
        partially_successful:
          type: integer
          description: >-
            Compounds where some member scans succeeded for this capability and
            some failed. Non-compound (standalone) scans cannot be partially
            successful, so they never contribute to this bucket.
          example: 1
        unsuccessful:
          type: integer
          description: Compounds where every member scan failed for this capability.
          example: 0
        incomplete:
          type: integer
          description: >-
            Compounds where the latest scan has not finished for this
            capability.
          example: 0
    StreamlinedAggregate:
      type: object
      description: >-
        One row of the aggregated streamlined response. Each row collapses every
        compound and standalone app under a given team or application group into
        a single set of summed counts.
      required:
        - name
        - app_count
        - incomplete_count
        - unsuccessful_count
        - vulns
        - oss_vulns
        - container_vulns
        - secrets
        - oss_risks
        - analysis_status
      properties:
        name:
          type: string
          description: The team name or application group name this row aggregates over.
          example: Team Alpha
        id:
          type: string
          description: >-
            The ID of the thing this row aggregates over. Currently present only
            when `axis=team`; application groups have no ID (or their name is
            their ID) and the field is omitted from the response on the
            app-group axis.
          example: 70c03eeb-a28a-4ba3-b537-de46ad46c083
        app_count:
          type: integer
          description: >-
            The number of distinct compounds (each polyglot compound counted
            once) and standalone apps that contribute to this row.
          example: 7
        incomplete_count:
          type: integer
          description: >-
            The number of units in this row whose latest scan has not completed
            and for which we have no concrete failure signal — in flight, or
            finished without a tallying step. Disjoint from
            `unsuccessful_count`.
          example: 1
        unsuccessful_count:
          type: integer
          description: >-
            The number of units in this row whose latest scan finished with a
            recorded failure (a FAILED pipeline status for standalones, or any
            analyze_failures row for the compound's polyglot scan). Disjoint
            from `incomplete_count`.
          example: 0
        vulns:
          $ref: '#/components/schemas/SASTVulnCounts'
        oss_vulns:
          $ref: '#/components/schemas/SCAVulnCounts'
        container_vulns:
          $ref: '#/components/schemas/SCAVulnCounts'
        secrets:
          type: integer
          example: 3
        oss_risks:
          type: integer
          example: 2
        risk_types:
          $ref: '#/components/schemas/OSSRiskSummary'
        analysis_status:
          type: object
          description: >-
            Per-capability breakdown of compound analysis status counts. SAST
            and SCA report independent status buckets so the caller can see,
            e.g., that all member compounds are clean for SCA but some failed
            for SAST.
          required:
            - sast
            - sca
          properties:
            sast:
              $ref: '#/components/schemas/AnalysisStatusCounts'
            sca:
              $ref: '#/components/schemas/AnalysisStatusCounts'
    ScanInfo:
      type: object
      required:
        - id
        - app
        - version
        - successful
      properties:
        id:
          type: string
          description: The unique identifier for the scan
          example: '1234'
        app:
          type: string
          description: The app represented by the scan
          example: hello-qwiet
        version:
          type: string
          description: The app version represented by the scan
          example: f348b507198fee7b6b57a460ef8a6c94783c59258f823dfcde41a2b5cb69765f
        successful:
          type: boolean
          description: Whether the scan was successful or not
        started_at:
          type: string
          format: date-time
          description: When the scan was started
        completed_at:
          type: string
          format: date-time
          description: When the scan was completed
        language:
          type: string
          description: The language of the analyzed application
          example: javascript
        number_of_expressions:
          type: integer
          description: The number of expressions found in the application
          example: 10
        tags:
          type: object
          description: The tags associated with this scan
    Scan:
      type: object
      required:
        - id
        - app
        - version
        - successful
      properties:
        id:
          type: string
          description: The unique identifier for the scan
          example: '1234'
        app:
          type: string
          description: The app represented by the scan
          example: hello-qwiet
        version:
          type: string
          description: The app version represented by the scan
          example: f348b507198fee7b6b57a460ef8a6c94783c59258f823dfcde41a2b5cb69765f
        successful:
          type: boolean
          description: Whether the scan was successful or not
        is_default_branch:
          type: boolean
          description: Whether the is a scan of the app's default branch or not
        started_at:
          type: string
          format: date-time
          description: When the scan was started
        completed_at:
          type: string
          format: date-time
          description: When the scan was completed
        language:
          type: string
          description: The language of the analyzed application
          example: javascript
        number_of_expressions:
          type: integer
          description: The number of expressions found in the application
          example: 10
        tags:
          type: object
          description: The tags associated with this scan
        oss_info:
          $ref: '#/components/schemas/OSSScan'
        counts:
          type: array
          items:
            $ref: '#/components/schemas/TagCount'
        findings_summaries:
          type: array
          items:
            $ref: '#/components/schemas/FindingsSummary'
        total:
          description: The total count across all summaries, excluding fixed and ignored
          type: integer
          example: 101
        total_fixed:
          description: The total fixed across all summaries
          type: integer
          example: 42
        total_ignored:
          description: The total ignored across all summaries
          type: integer
          example: 17
    CompoundScanResponse:
      type: object
      properties:
        compound_id:
          type: string
          format: uuid
          description: The compound ID of the polyglot scan, if available
        polyglot_scan_id:
          type: integer
          minimum: 1
          description: The polyglot scan ID, if available
        scans:
          type: array
          description: The element scans that form the polyglot scan
          items:
            $ref: '#/components/schemas/ScanInfo'
        findings_summaries:
          type: array
          items:
            $ref: '#/components/schemas/FindingsSummary'
        counts:
          type: array
          items:
            $ref: '#/components/schemas/TagCount'
    OSSScan:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
