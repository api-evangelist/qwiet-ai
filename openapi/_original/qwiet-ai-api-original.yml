          example: hello-qwiet
        type:
          type: string
          description: The type of finding
          example: vuln
        title:
          type: string
          description: The title of the finding
          example: >-
            Sensitive Data Leak: Sensitive data contained in HTTP
            request/response
        description:
          type: string
          description: The description of the finding
          example: >-
            Sensitive data included in HTTP request/response. This could result
            in sensitive data exposure
        severity:
          $ref: '#/components/schemas/Severity'
        owasp_category:
          type: string
          description: The OWASP category of the finding
          example: a3-sensitive-data-exposure
        category:
          type: string
          description: The category of the finding
          example: Sensitive Data Leak
        status:
          $ref: '#/components/schemas/Status'
        assignee:
          type: string
          description: The email address of the user assigned to this finding
        version_first_seen:
          type: string
          description: The app version when this finding was first seen
        details:
          type: object
          description: The specific details regarding the finding
        internal_id:
          type: string
          description: The internal violation ID for this finding. Do not use.
          example: sensitive-to-http/f5ecc6f0cae821f47a06c939d1b9c7ee
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          example:
            - key: severity
              value: info
            - key: cvss_score
              value: 2
    Version:
      type: object
      required:
        - version
        - scan
      properties:
        version:
          type: string
          example: 0a907104bfe6175e3a3ea375e2cb7728
        scan:
          $ref: '#/components/schemas/Scan'
        findings_summaries:
          type: array
          items:
            $ref: '#/components/schemas/FindingsSummary'
        total:
          description: >-
            The total count across all summaries, excluding findings that are
            fixed and ignored
          type: integer
          example: 1489
        total_fixed:
          description: The total fixed across all summaries
          type: integer
          example: 131
        total_ignored:
          description: The total ignored across all summaries
          type: integer
          example: 197
    Versions:
      type: array
      items:
        $ref: '#/components/schemas/Version'
    DataflowElement:
      type: object
      properties:
        location:
          type: object
          properties:
            line_number:
              type: integer
              description: The line number in the source code
            method_name:
              type: string
              description: The fully qualified method name
            short_method_name:
              type: string
              description: The abbreviated method name
            file_name:
              type: string
              description: The file name
            vcs_url:
              type: string
              description: The URL to the source code (i.e., the URL to Gitlab)
        variable_info:
          type: object
          properties:
            Variable:
              type: object
              oneOf:
                - $ref: '#/components/schemas/VariableInfoLocal'
                - $ref: '#/components/schemas/VariableInfoMember'
                - $ref: '#/components/schemas/VariableInfoStack'
                - $ref: '#/components/schemas/VariableInfoParameter'
                - $ref: '#/components/schemas/VariableInfoReturn'
                - $ref: '#/components/schemas/VariableInfoGlobal'
        method_tags:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
    VariableInfoLocal:
      type: object
      properties:
        Local:
          type: object
          properties:
            symbol:
              type: string
            type:
              type: string
    VariableInfoMember:
      type: object
      properties:
        Member:
          type: object
          properties:
            symbol:
              type: string
            type:
              type: string
            enclosing_class:
              type: string
    VariableInfoStack:
      type: object
      properties:
        Stack:
          type: object
          properties:
            type:
              type: string
    VariableInfoParameter:
      type: object
      properties:
        Parameter:
          type: object
          properties:
            symbol:
              type: string
            param_index:
              type: integer
            type:
              type: string
            is_output_param:
              type: boolean
    VariableInfoReturn:
      type: object
      properties:
        Return:
          type: object
          properties:
            type:
              type: string
    VariableInfoGlobal:
      type: object
      properties:
        Global:
          type: object
          properties:
            symbol:
              type: string
            type:
              type: string
    FindingsSummary:
      type: object
      required:
        - total
      properties:
        finding_type:
          type: string
          description: The type of finding this summary is for
          example: vuln
        total:
          type: integer
          description: The total number of findings
          example: 10
        total_reachable:
          type: integer
          description: The total number of reachable findings
        total_ignored:
          type: integer
          description: The total number of ignored findings
          example: 1
        total_fixed:
          type: integer
          description: The total number of fixed findings
          example: 3
        by_severity:
          type: object
          description: The summary of findings (by severity)
          example:
            info:
              total: 6
            critical:
              total: 3
              total_fixed: 3
            moderate:
              total: 1
              total_ignored: 1
        by_category:
          type: object
          description: The summary of findings (by category)
          example:
            Sensitive Data Leak:
              total: 10
              total_fixed: 3
              total_ignored: 1
        by_assignee:
          type: object
          description: The summary of findings (by assignee)
          example:
            test@qwiet.ai:
              total: 10
              total_fixed: 3
              total_ignored: 1
    ReportCompare:
      type: object
      properties:
        finding_type:
          type: string
          description: The type of finding this comparison is for
          example: vuln
        total:
          type: integer
          description: The total number of findings
          example: 10
        new:
          type: integer
          description: The total number of new findings
          example: 1
        fixed:
          type: integer
          description: The total number of fixed findings
          example: 1
        common:
          type: integer
          description: The total number of common findings
          example: 9
        regression:
          type: integer
          description: The total number of regression findings
          example: 1
        by_severity:
          type: object
          description: The comparison of findings (by severity)
          example:
            critical:
              total: 10
              new: 1
              fixed: 1
              common: 9
    ReportParams:
      type: object
      required:
        - apps
        - from
        - until
      properties:
        apps:
          type: array
          items:
            $ref: '#/components/schemas/SCACVEsAppAndBranch'
        from:
          type: integer
          description: >-
            The timestamp for the earliest scan that should be included in the
            report (represented as a Unix timestamp in seconds)
        until:
          type: integer
          description: >-
            The timestamp for the latest scan that should be included in the
            report (represented as a Unix timestamp in seconds)
    SCAPackagesParams:
      type: object
      properties:
        apps:
          type: array
          description: >-
            Filter results to specific applications. If omitted, all
            applications in the organization are included.
          items:
            type: object
            required:
              - app
            properties:
              app:
                type: string
                description: App ID
              branch:
                type: string
                description: Branch name
              scan:
                type: string
                description: Scan ID
        package_url:
          type: string
          minLength: 3
          description: >-
            Filter packages whose package URL contains this substring. Cannot be
            combined with finding_tags or with specifying a branch in apps.
        cve:
          type: string
          minLength: 3
          description: >-
            Filter packages affected by a CVE whose ID contains this substring.
            Cannot be combined with finding_tags or with specifying a branch in
            apps.
        finding_type:
          type: string
          description: The type of package finding to return
          enum:
            - package
            - container_package
        finding_tags:
          type: object
          description: >-
            Tag-based filtering. Keys are tag names and values are arrays of
            acceptable tag values. Cannot be combined with package_url or cve.
            Maximum 50 tags.
          additionalProperties:
            type: array
            items:
              type: string
        sort:
          type: string
          description: How results should be sorted; defaults to total_reachable_oss_vulns
          enum:
            - package
            - package_url
            - type
            - version
            - license
            - first_seen
            - total_vulns
            - total_oss_vulns
            - total_reachable
            - total_reachable_oss_vulns
            - total_exploitable
            - total_apps
        order:
          type: string
          description: The direction of the sort; defaults to descending
          enum:
            - desc
            - asc
        per_page:
          type: integer
          description: Number of results per page; defaults to 20
        page:
          type: integer
          description: Page number (1-based); defaults to 1
    SCALicensesParams:
      type: object
      required:
        - apps
      properties:
        apps:
          type: array
          items:
            type: object
            required:
              - app
            properties:
              app:
                type: string
                description: App ID
              branch:
                type: string
                description: Branch name
              scan:
                type: string
                description: Scan ID
        finding_type:
          type: string
          description: The type of finding
          enum:
            - package
            - container_package
    SCACVEsAppAndBranch:
      type: object
      required:
        - app
      properties:
        app:
          type: string
          description: App ID
        branch:
          type: string
          description: Branch name
    SCACVEsParams:
      type: object
      required:
        - apps
      properties:
        apps:
          type: array
          items:
            $ref: '#/components/schemas/SCACVEsAppAndBranch'
        finding_tags:
          type: object
          example:
            reachability:
              - reachable
        limit:
          type: integer
          description: The number of results to return
          example: 5
    SCACVETrendsParams:
      type: object
      required:
        - apps
      properties:
        apps:
          type: array
          items:
            $ref: '#/components/schemas/SCACVEsAppAndBranch'
        from:
          type: integer
          description: >-
            The timestamp for the earliest scans that should be included in the
            report (represented as a Unix timestamp in seconds)
        until:
          type: integer
          description: >-
            The timestamp for the latest scans that should be included in the
            report (represented as a Unix timestamp in seconds)
    NGSASTSubscription:
      type: object
      required:
        - type
        - valid_from
        - valid_to
        - apps_usage
        - users_usage
      properties:
        type:
          type: string
          description: The name of the Qwiet AI by Harness subscription
          example: Enterprise
        product_id:
          type: string
          description: >-
            The product ID; do not use for decision making if possible; instead
            use capabilities or the `payment_tier` value
          example: INSPECT_PROTECT_FULL
        payment_tier:
          type: string
          description: >-
            The payment tier. UNKNOWN indicates a server-side error in
            determining a payment tier
          enum:
            - FREE
            - TRIAL
            - PAID
            - UNKNOWN
        valid_from:
          type: string
          format: date
          description: The date from which this subscription is valid
        valid_to:
          type: string
          format: date
          description: >-
            The date to which this subscription is valid. Value is an empty
            string if not applicable for the returned subscription
        apps_usage:
          $ref: '#/components/schemas/SubscriptionUsage'
        users_usage:
          $ref: '#/components/schemas/SubscriptionUsage'
        langs_limits:
          type: object
        capabilities:
          type: object
    OcularSubscription:
      type: object
      required:
        - active
      properties:
        active:
          type: boolean
          description: >-
            A boolean flag that is true when there is an active Ocular
            subscription
        type:
          type: string
          description: The type of Ocular subscription
        valid_from:
          type: string
          format: date
          description: The date from which this subscription is valid
        valid_to:
          type: string
          format: date
          description: The date to which this subscription is valid
    SubscriptionUsage:
      type: object
      properties:
        current:
          type: integer
          description: The current subscription usage for the given property
        max:
          type: integer
          description: >-
            The maximal subscription usage allowed for the given property (`0`
            stands for no maximal value)
    Subscription:
      type: object
      required:
        - product_name
        - valid_from
        - valid_to
      properties:
        product_name:
          type: string
          description: The name of the Qwiet product to which the subscription refers
        valid_from:
          type: string
          format: date
          description: The date from which this subscription is valid
        valid_to:
          type: string
          format: date
          description: The date to which this subscription is valid
        capabilities:
          type: object
    SendInBulkToJiraRequest:
      type: object
      required:
        - scan_id
        - finding_ids
      properties:
        scan_id:
          type: number
          description: The ID of the scan to which the findings belong
        finding_ids:
          type: array
          description: A list of the finding IDs to submit to JIRA
          items:
            type: number
    JiraIntegration:
      type: object
      required:
        - jira_project_url
        - vulnerability_created_or_changed_url
        - vulnerability_status_changed_url
        - vulnerability_assignment_changed_url
        - jira_token
      properties:
        jira_project_url:
          type: string
          description: The Jira URL of the project
        vulnerability_created_or_changed_url:
          type: string
          description: >-
            The URL that Qwiet will use to create new Jira issues based on
            identified vulnerabilities
        vulnerability_status_changed_url:
          type: string
          description: The URL that Qwiet will use to change the status of a Jira issue
        vulnerability_assignment_changed_url:
          type: string
          description: The URL that Qwiet will use to change the assignment of a Jira issue
        jira_token:
          type: string
          description: >-
            The token issued by Jira that authorizes Qwiet to read Jira project
            data, and update issue status/assignment
    JiraSubmissionPreRequisites:
      type: object
      properties:
        no_pre_reqs:
          type: boolean
          description: Indicates there are no prerequisites to create an issue in this JIRA
        already_exists:
          type: boolean
          description: Reserved for future endpoints where prerequisites are per finding
        fields:
          $ref: '#/components/schemas/JiraPreRequisitesField'
    JiraPreRequisitesField:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          description: The field name in JIRA
        type:
          type: string
          description: The field type according to JIRA
        options:
          type: object
          additionalProperties: true
          description: >-
            A list of key/values to be used if this field values are limited to
            a set of choices.
    JiraIssueMetadata:
      type: object
      required:
        - violation_id
      properties:
        violation_id:
          type: string
          description: The ID of the violation to apply this status/assignment to
        new_status:
          $ref: '#/components/schemas/JiraStatus'
        new_assignee:
          $ref: '#/components/schemas/JiraAssignedTo'
    JiraAssignedTo:
      type: object
      required:
        - assigned_to_email
        - assigned_by_email
      properties:
        assigned_to_email:
          type: string
          format: email
          description: The email address of the user to which the issue was assigned
        assigned_by_email:
          type: string
          format: email
          description: The email address of the user that assigned the issue
    JiraStatus:
      type: object
      required:
        - state
        - changed_by_email
      properties:
        state:
          type: string
          description: The state of the issue
          enum:
            - todo
            - fill
            - in
            - the
            - enums
        changed_by_email:
          type: string
          format: email
          description: The email address of the user that changed the issue state
    TagCount:
      allOf:
        - $ref: '#/components/schemas/Tag'
        - type: object
          properties:
            finding_type:
              type: string
              description: The type of finding
              example: vuln
            count:
              type: integer
              example: 42
    Tag:
      anyOf:
        - $ref: '#/components/schemas/TagWithString'
        - $ref: '#/components/schemas/TagWithNumber'
    TagWithString:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
          description: The key for the tag key-value pair
          example: category
        value:
          type: string
          description: The value for the tag key-value pair
          example: XSS
    TagWithNumber:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
          description: The key for the tag key-value pair
          example: cvss_score
        value:
          type: number
          description: The value for the tag key-value pair
          example: 5.2
    GitHubRepo:
      type: object
      required:
        - name
        - full_name
        - html_url
        - language
        - fork
        - private
        - owner
      properties:
        name:
          type: string
          description: The name of the repository
        full_name:
          type: string
          description: The name of the GitHub account and repository
        description:
          type: string
          description: A description of the repository
        default_branch:
          type: string
          description: The repository's current default branch
        pushed_at:
          type: string
          format: date-time
          description: The timestamp of the last push to the repository
        html_url:
          type: string
          format: uri
          description: The URL that can be used to load the repository in a browser
        language:
          type: string
          description: >-
            GitHub's best guess at the language the code in the repo is written
            in
        fork:
          type: boolean
          description: A boolean flag that is true when the repository is a fork
        private:
          type: boolean
          description: A boolean flag that is true when the repository is private
        permissions:
          $ref: '#/components/schemas/GitHubUserPermissions'
        owner:
          $ref: '#/components/schemas/GitHubRepoOwner'
    GitHubUserPermissions:
      description: >-
        An object that describes the permissions that the user has in this
        repository
      type: object
      properties:
        admin:
          type: boolean
          description: >-
            A boolean flag that is true when the user has admin rights to the
            repository
        pull:
          type: boolean
          description: >-
            A boolean flag that is true when the user has pull rights to the
            repository
        push:
          type: boolean
          description: >-
            A boolean flag that is true when the user has push rights to the
            repository
    GitHubRepoOwner:
      description: An object describing the owner of the repository
      type: object
      required:
        - login
        - avatar_url
        - html_url
        - type
      properties:
        login:
          type: string
          description: The GitHub user name or organization name of the repo owner
        avatar_url:
          type: string
          format: uri
          description: The GitHub avatar of the repo owner
        html_url:
          type: string
          format: uri
          description: >-
            The URL that can be used to load the repo owner's GitHub account
            page
        type:
          type: string
          description: The type of repo owner this is (i.e., user, organization)
    IntegrationStepStatus:
      description: >-
        An object describing the status of a given step in a multi-step
        integration
      type: object
      required:
        - title
        - status
        - step_name
        - step_number
      properties:
        title:
          type: string
          description: The short description of the step being performed
        description:
          type: string
          description: The reason for the step being performed
        status:
          type: string
          description: The status value representing the progress of this step
          example: complete
        step_name:
          type: string
          description: The step being performed
        step_number:
          type: integer
          description: >-
            An integer describing the order in which the steps should be
            performed
        metadata:
          type: object
          description: >-
            An object that holds additional properties (currently, the only use
            case is "link")
          properties:
            link:
              type: string
              format: uri
    SAMLConfigName:
      description: The name and ID of the specified SAML configuration
      type: string
      pattern: ^[a-zA-Z0-9-_]{1,255}$
    SAMLConfig:
      description: An object describing a SAML configuration for an organization
      type: object
      allOf:
        - $ref: '#/components/schemas/SAMLConfigCreate'
        - type: object
          required:
            - sp_metadata_url
            - sp_login_url
          properties:
            idp_default_relay_state:
              type: string
              description: >
                The opaque configuration blob that should be set in the SAML
                identity provider configuration as the default relay state. Note
                that this field is only available if identity provider-initiated
                logins are enabled via the allow_idp_initiated_logins setting
            sp_metadata_url:
              type: string
              description: >-
                The metadata URL that can be used to configure the SAML identity
                provider-initiated logins to Qwiet
              format: uri
            sp_login_url:
              type: string
              description: >-
                The login URL that can be used to start a service
                provider-initiated log in to Qwiet using the SAML identity
                provider
              format: uri
    SAMLConfigCreate:
      description: An object describing a SAML configuration for an organization
      type: object
      allOf:
        - $ref: '#/components/schemas/SAMLConfigUpdate'
        - type: object
          required:
            - name
          properties:
            name:
              $ref: '#/components/schemas/SAMLConfigName'
    SAMLConfigUpdate:
      description: An object describing a SAML configuration for an organization
      type: object
      properties:
        idp_metadata_url:
          type: string
          description: The URL of the SAML Identity Provider's (IdP) metadata endpoint
          format: uri
        idp_metadata:
          type: string
          description: >-
            The raw XML metadata that can be provided instead of
            idp_metadata_url
        allow_implicit_invites:
          type: boolean
          description: >-
            Sets whether any successful SAML-identified user should be allowed
            to join your org (true) or not (false)
        default_org_role:
          type: string
          description: >-
            The default role that new users in the org are given when joining
            via SAML. If not specified, this defaults to "TEAM_DEFINED"
        sign_auth_requests:
          type: boolean
          description: Whether to sign SAML requests sent from Qwiet to the SAML IdP
        allow_idp_initiated_logins:
          description: >
            Whether SAML-initiated logins should be allowed or not. By default
            they are disabled, as *service provider* (SP) initiated logins are
            generally considered safer. When enabled, the saml_config endpoint
            will have another field, "idp_default_relay_state", which contains
            an opaque blob that needs to be set as the *default relay state* in
            the IdP configuration. This state will be sent on every request
            where no *relay state* was provided and contains some additional
            information to help the SP (Qwiet) properly route the request.
          type: boolean
    OrgConfig:
      description: An object describing the configuration options of an organization
      type: object
      properties:
        sso_name:
          type: string
          description: >-
            The unique name assigned to the organization that can be used to log
            in via SSO
        default_saml_config:
          type: string
          description: >-
            The name of the SAML config to use as the default for this
            organization
        allowed_non_admin_auth_providers:
          type: array
          description: >-
            A list of auth providers that non-admins are allowed to use to
            access the org.
          items:
            type: string
            enum:
              - google
              - github
              - username-password
              - sl-saml2
        security_training_provider:
          type: string
          enum:
            - kontra
            - secure-code-warrior
        analysis_configuration:
          $ref: '#/components/schemas/OrgAnalysisConfiguration'
        autofix_configuration:
          $ref: '#/components/schemas/AutoFixConfig'
        session_timeout_hours:
          type: integer
          description: >-
            The number of hours after which the session will expire. The default
            value is 168 hours (7 days).
    OrgAutoFixConfig:
      description: >-
        An object describing the AutoFix configuration options of an
        organization
      type: object
      properties:
        autofix_configuration:
          $ref: '#/components/schemas/AutoFixConfig'
    AutoFixConfig:
      description: >-
        An object describing the AutoFix configuration options of an
        organization
      type: object
      properties:
        enable:
          type: boolean
          description: set to true if AutoFix is enabled for the organization
        disable:
          type: boolean
          description: set to true if AutoFix is disabled for the organization
        auto_run:
          type: boolean
          description: set to true if AutoFix should run automatically
        auto_run_disable:
          type: boolean
          description: >-
            set to true if AutoFix should stop running automatically, this will
            be stored as auto_run = false
        manual:
          type: boolean
          description: set to true if AutoFix should run manually
        manual_disable:
          type: boolean
          description: >-
            set to true if AutoFix should stop running manually, this will be
            stored as manual = false
        max_fixes_per_run:
          type: integer
          description: >-
            The maximum number of AutoFix suggestions that can be generated in a
            single run
        fix_only_severities:
          type: array
          items:
            $ref: '#/components/schemas/Severity'
          description: >-
            The severities of findings for which AutoFix will generate
            suggestions
    OrgAnalysisConfiguration:
      description: Organization level analysis configuration
      type: object
      properties:
        secrets:
          $ref: '#/components/schemas/SecretsConfiguration'
    TeamAnalysisConfiguration:
