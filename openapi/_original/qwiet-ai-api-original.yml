  /orgs/{orgID}/dependencies:
    parameters:
      - $ref: '#/components/parameters/orgID'
      - $ref: '#/components/parameters/search'
      - name: page
        in: query
        description: >-
          The page of results to fetch. Currently asking for pages beyond 20
          will fail.
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 1
          example: 1
      - name: per_page
        in: query
        description: Number of results per page.
        schema:
          type: integer
          minimum: 0
          default: 250
          maximum: 1000
      - name: from
        in: query
        description: >-
          Packages found during scans created as of this time are included in
          the search. Value should be a Unix timestamp (in seconds). Defaults to
          4 months before `until`. Increasing the time window increases the
          chance that the search will timeout.
        schema:
          type: integer
      - name: until
        in: query
        description: >-
          Packages found during scans created up to this time are included in
          the search. Value should be a Unix timestamp (in seconds). Defaults to
          the creation timestamp of the most recent successful scan.
        schema:
          type: integer
