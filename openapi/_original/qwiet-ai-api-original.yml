          example: INTERNAL_SERVER_ERROR
        message:
          type: string
          description: A message describing the error
          example: Internal Server Error
        validation_errors:
          type: array
          description: >-
            The validation errors the user should correct before re-submitting
            the request
          items:
            type: string
            description: A description of the validation error
    AppScanCheckScan:
      type: object
      oneOf:
        - type: object
          properties:
            branch:
              type: string
              description: >
                The branch to get the scan from. For the target scan, this is
                the last scan in the branch. For the source scan:

                  - If the target scan and the source scan's branches are
                    the same, then it is the previous scan in the branch

                  - If the target scan and the source scan's branches are
                    NOT the same, then it is the last scan in the branch
        - type: object
          properties:
            scan:
              type: integer
              format: int64
              description: |
                the id of the scan
    AppScanCheckScanInfo:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          minimum: 1
    AppScanCheckResponse:
      type: object
      required:
        - target
        - rules
      properties:
        source:
          $ref: '#/components/schemas/AppScanCheckScanInfo'
        target:
          $ref: '#/components/schemas/AppScanCheckScanInfo'
        rules:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AppScanCheckFindingsSummary'
        totals:
          $ref: '#/components/schemas/AppScanCheckFindingsSummary'
    UpdateAppLabelsRequest:
      type: object
      properties:
        add:
          type: array
          items:
            type: string
            description: A list of labels to be added to the application
        remove:
          type: array
          items:
            type: string
            description: A list of labels to be removed from the application
        clear:
          type: boolean
          description: >-
            A boolean flag that is true when all labels should be removed from
            the application
    AppScanCheckFindingsSummary:
      type: object
      required:
        - matched
        - over_threshold
      properties:
        by_tag:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
              minimum: 0
        reachable:
          type: integer
          minimum: 0
        matched:
          type: integer
          minimum: 0
        over_threshold:
          type: integer
          minimum: 0
        findings:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                minimum: 0
              title:
                type: string
              tags:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
    SetBaseBranch:
      type: object
      description: >-
        contains a base branch to be set (a branch being present might
        implicitly cause base scan to be enabled in a project
      required:
        - branch_name
      properties:
        branch_name:
          type: string
          description: the name of the branch to be set as base branch
    SetBaseBranchResponse:
      type: object
      description: >-
        contains information about the branch just set as base and scans found
        for it and re-processed, this number might be 0 if no reprocess
        happened.
      required:
        - branch_name
      properties:
        branch_name:
          type: string
          description: the name of the branch to be set as base branch
        scan_count:
          type: integer
          description: the number of scans backfilled
    ScanBranch:
      type: object
      description: >-
        contains information about a branch, how many scans it has, the first
        and the last scan in the branch
      required:
        - created_at
        - updated_at
        - branch_name
        - scan_count
      properties:
        created_at:
          type: string
          description: the date-time of the creation of the branch, in UTC.
          format: date-time
        updated_at:
          type: string
          description: the date-time of the last update of the branch, in UTC.
          format: date-time
        branch_name:
          type: string
          description: the name of the branch
        scan_count:
          type: integer
          description: the number of scans in the branch, if any
        first_scan:
          type: integer
          description: the timestamp of the oldest scan we have for this branch, if any
        last_scan:
          type: integer
          description: the timestamp of the newest scan we have for this branch, if any.
    SAMLUserMembership:
      type: object
      description: contains information about a user's role in a team.
      required:
        - team_id
        - role
      properties:
        team_id:
          type: string
          description: the id of the team
        role:
          type: string
          description: the role of the user in the team
          enum:
            - TEAM_ADMIN
            - TEAM_MEMBER
            - TEAM_GUEST
    SAMLUser:
      type: object
      description: contains the all the necessary information to provision a SAML user.
      required:
        - email
        - organization_role
      properties:
        name:
          type: string
          description: the name of the user
        email:
          type: string
          description: the email of the user
        organization_role:
          type: string
          enum:
            - SUPER_ADMIN
            - POWER_USER
            - MEMBER
            - GUEST
            - TEAM_DEFINED
        team_membership:
          type: array
          items:
            $ref: '#/components/schemas/SAMLUserMembership'
    SAMLUserProvisioningRequest:
      type: array
      items:
        $ref: '#/components/schemas/SAMLUser'
    SAMLUserProvisioningResponse:
      type: object
      description: contains the results of a bulk users provisioning.
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserMembershipInfo'
        rejected_emails:
          type: array
          description: >-
            list of emails that were rejected due to their domain not being
            reserved to the user.
          items:
            type: string
        rejected_org_roles:
          type: array
          description: >-
            list of roles that were considered invalid for an organization level
            role due to not conforming to the provided list.
          items:
            type: string
        rejected_team_roles:
          type: array
          description: >-
            list of roles that were considered invalid for a team level role due
            to not conforming to the provided list.
          items:
            type: string
    SAMLUserAccessTokenResetRequest:
      type: object
      description: contains the list of user IDs whose SAML access tokens should be reset.
      required:
        - user_ids
      properties:
        user_ids:
          type: array
          description: list of user IDs (v2) whose access tokens should be reset.
          minItems: 1
          items:
            type: string
            format: uuid
    SAMLUserAccessTokenResetResponse:
      type: object
      description: contains the results of a bulk SAML user access token reset.
      properties:
        reset:
          type: array
          description: list of user IDs whose access tokens were successfully reset.
          items:
            type: string
            format: uuid
        not_found:
          type: array
          description: list of user IDs that were not found in the organization.
          items:
            type: string
            format: uuid
        not_saml:
          type: array
          description: list of user IDs that were rejected because they are not SAML users.
          items:
            type: string
            format: uuid
    AppSpec:
      type: object
      description: contains the information necessary to provision an app.
      required:
        - id
      properties:
        id:
          type: string
          pattern: '[a-zA-Z0-9]([a-zA-Z0-9_:.-]*[a-zA-Z0-9])?'
          description: the id of the app
        name:
          type: string
          description: the user friendly name of the app
        team_id:
          type: string
          description: the id of the team the app belongs to
        base_branch:
          type: string
          description: the name of the principal branch of the app.
          example: master
